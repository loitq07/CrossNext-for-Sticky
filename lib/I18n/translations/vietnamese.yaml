STR_PET_CURED: "Thú cưng đến gần bạn lần nữa, cảm thấy khỏe hơn. Sức khỏe đã được phục hồi."
STR_PET_EGG_HEALTH: "Chức năng chăm sóc sẽ có khi trứng nở. Hãy tiếp tục đọc sách nhé!"
STR_PET_HEALTH_HELP: "Độ vệ sinh giảm dần theo thời gian. Khi độ vệ sinh từ 20 trở xuống, Bạn đồng hành của bạn có thể bị ốm. Tắm rửa miễn phí; chữa bệnh tốn một thuốc chữa."
STR_PET_MEDICINE_HELP: "Thuốc chữa có sẵn khi đọc 30 và 120 phút mỗi ngày. Tắm rửa giúp ngăn ngừa bệnh tật; nghỉ ngơi giúp phục hồi năng lượng."
