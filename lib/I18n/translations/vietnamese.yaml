STR_CAR_GUIDE_EXAMPLE_COPY: "Nếu có 1 lời nói dối thì có đúng một câu đầy đủ là sai. Những điều khác là đúng."
STR_CAR_GUIDE_OR_COPY: "Ít nhất một người có tội; cả hai đều có thể có tội. Nếu đó là lời nói dối thì cũng không."
STR_CAR_GUIDE_AND_COPY: "Cả hai đều có tội. Nếu đó là lời nói dối thì ít nhất có một người đã không làm điều đó."
STR_CAR_GUIDE_COMPARE_COPY: "So sánh các tuyên bố, không phải cảm giác tội lỗi. Sự chân thành như nhau: cả hai đều đúng hoặc cả hai đều sai. Sự chân thành khác nhau: chính xác một là sai."
STR_CAR_GUIDE_TRUTH_EXAMPLE_COPY: "A nói thật và B nói dối: “Cả hai đều nói thật” là sai. Manh mối về sự chân thành cũng có thể sai."
STR_CAR_GUIDE_HEIGHT_COPY: "Đặc điểm là đáng tin cậy. Cao hơn/ngắn hơn: ít nhất một thủ phạm liên quan đến người nói. Động vật ăn tạp không đáp ứng được manh mối của động vật ăn thịt cũng như động vật ăn cỏ."
STR_CAR_GUIDE_MARKS_COPY: "Nhấn vào tên để đọc. Nhấn vào ghi chú để quay vòng? / Sự thật / Dối trá hay ? / Nghi phạm / Vô tội. Đây là những giả thuyết, không phải kiểm tra."
STR_CAR_GUIDE_CONFIRM_COPY: "Đánh dấu những nghi phạm mà bạn cho là có tội và mở lời buộc tội. Chọn chính xác số được chỉ định. Một lời buộc tội được xác nhận sai phải trả giá bằng một mạng sống."
STR_CAR_GUIDE_LIVES_COPY: "Sơ cấp/Bình thường: 2 mạng. Cao cấp/Chuyên gia: 1. Lời buộc tội đúng sẽ giải quyết được vụ việc. Không còn mạng sống nữa, hãy xem giải pháp."
STR_CAR_GUIDE_CAMPAIGN_COPY: "1.470 trường hợp. Trong mỗi cấp độ: 1 thủ phạm, sau đó là 2 (trừ Người mới bắt đầu); số người nói dối tăng lên trong mỗi nhóm."
