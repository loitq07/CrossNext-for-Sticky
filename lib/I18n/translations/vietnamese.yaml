STR_CAR_GUIDE_RELIABLE: "Sự thật đáng tin cậy"
STR_CAR_GUIDE_RELIABLE_COPY: "Tên, chiều cao và chế độ ăn uống là đáng tin cậy. Lời khai có thể nói dối. Chiều cao là hư cấu."
STR_CAR_GUIDE_HEIGHT: "Chiều cao và chế độ ăn"
STR_CAR_GUIDE_HEIGHT_COPY: "Đặc điểm là đáng tin cậy. Cao hơn/thấp hơn: ít nhất một thủ phạm tương đối so với người nói. Động vật ăn tạp không thỏa mãn cả manh mối ăn thịt lẫn ăn cỏ."
STR_CAR_GUIDE_MARKS: "Ghi chú của bạn"
STR_CAR_GUIDE_MARKS_COPY: "Chạm vào tên để đọc. Chạm vào ghi chú để chuyển đổi ? / Sự thật / Lời nói dối hoặc ? / Nghi phạm / Vô tội. Đây là các giả thuyết, không phải kiểm tra."
STR_CAR_GUIDE_NAV: "Điều hướng"
STR_CAR_GUIDE_NAV_COPY: "Có 3 nhân vật mỗi trang ở chế độ dọc. Các mũi tên hiển thị những người khác."
STR_CAR_GUIDE_CONFIRM: "Xác nhận cáo buộc"
