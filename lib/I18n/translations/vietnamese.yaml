STR_FLASHCARDS_HELP: "Sao chép bộ thẻ Anki (.apkg/.colpkg, .anki2/.anki21), CSV/TSV/văn bản hoặc thư mục Study đã chuyển đổi vào /FLASHCARDS. Sử dụng thư mục con: tối đa 128 mục mỗi thư mục.\n\nNhập chấp nhận thẻ văn bản Basic, đảo ngược và cloze đơn giản. Âm thanh và HTML tùy chỉnh không được hỗ trợ. Chuyển đổi bộ thẻ hình ảnh/CJK trước. Ôn tập ngoại tuyến sử dụng FSRS. Nhập sẽ bắt đầu một lịch trình mới và giữ nguyên bản gốc."
