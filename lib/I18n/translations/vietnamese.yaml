STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Hãy giúp tôi đối chiếu những trang giấy chúng ta mang về. Một cái tên bên lề có thể cho biết ký ức ấy thuộc về gia đình nào."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Hãy đọc những lời kể mà hàng xóm mang đến quảng trường. Chúng ta cần đặt mỗi cái tên bên cạnh cuộc đời của người đó."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Hãy giúp tôi đối chiếu lời kể của các thủy thủ. Tôi không thể cho thêm một con thuyền nào vào con kênh mà chúng ta không còn nhớ."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Hãy giúp tôi đọc những cuốn sách được cứu. Khi chúng rời khỏi những căn phòng này, tôi muốn có người biết chúng mang câu chuyện của ai."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Hãy giúp tôi đối chiếu lời kể từ các trạm trú. Lữ khách tiếp theo cần tìm thấy một con đường, chứ không phải thêm một tiếng vọng đánh lừa."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Hãy giúp chúng tôi đối chiếu những chuyến đi xưa. Nhớ được một cái giếng có thể là khác biệt giữa đến nơi và biến mất giữa cát."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Hãy giúp tôi lắng nghe lời kể của những người hàng xóm. Đồng hồ không thể cho tôi biết họ đã mong làm gì với ngày hôm ấy."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Hãy giúp chúng tôi đọc những lời kể gửi về từ các vùng được giải phóng. Cung điện đã có quá nhiều năm chỉ nói chuyện với chính mình."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Hãy giúp tôi sắp xếp lời kể của những người làm vườn. Những hạt giống này cần nhiều hơn một cái tên trên bao."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Hãy giúp chúng tôi giữ cho những câu chuyện này được lưu truyền. Tôi muốn những người chúng ta tìm thấy có thể nghe được nhau."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Hãy giúp chúng tôi đọc những lời kể gửi đến con đường cuối cùng. Mỗi lời kể thuộc về một người đang chờ bên ngoài tường thành của nhà vua."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Hãy giúp chúng tôi đọc trọn những lời kể này. Sau bao lâu xa cách, chủ nhân của chúng xứng đáng nhiều hơn một cái tên trong danh sách."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora vuốt phẳng trang giấy bằng lòng bàn tay. “Tôi lại nghe được dòng ấy rồi,” cô nói. Tối nay cô sẽ để cuốn sách mở bên cạnh ngọn đèn."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Ở sạp sách, có người kéo ghế nhường chỗ cho bạn. Một lời kể còn dang dở vừa có thêm một dòng; chủ nhân của nó nâng trang giấy bằng cả hai tay mang về nhà."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara gấp lại trang giấy vừa đọc được và đặt cạnh cuốn sổ thủy triều. Trước khi quay lại bên cửa sổ, cô cảm ơn bạn bằng giọng khàn đi vì gió biển."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri đặt một dải vải khô giữa hai trang. “Cuốn này đi được rồi.” Cô ôm cuốn sách vào ngực trước khi mang nó đến chỗ những cuốn khác."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren đặt ba lô lên tảng đá và lắng nghe cho đến khi bạn đọc xong. Rồi anh nhắc lại lời của một lữ khách, lần này không cần nhìn vào trang giấy."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir luồn dải lụa qua các ngón tay, đọc một cái tên mà trước đây rất khó nhận ra. Ông xếp cho bạn một chỗ bên đống lửa."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin đặt xuống dụng cụ vẫn xoay trong tay. Một lúc lâu ông kể về người trong lời kể, mặc cho chiếc đồng hồ tích tắc không ai để ý."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera đặt lời kể ra khỏi chồng chiếu chỉ của hoàng gia. Bà bảo mang thêm một chiếc ghế, rồi cùng bạn nghe những dòng cuối."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster đánh dấu trang bằng một chiếc lá sạch. Cô khẽ cảm ơn bạn; một lát sau bạn nghe cô đọc lại đoạn ấy bên đài phun nước."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Một mẩu thư ngắn đến cùng xấp giấy tiếp theo. Liora đã chép lại một đoạn bạn giúp khôi phục; bên lề cô viết: “Cả nhà đã cùng đọc đoạn này.”"
STR_QUEST_CAM_JOURNEY_THANKS_10: "Lá thư chỉ dài vài dòng. Liora chừa chỗ để bạn hồi âm, như thể cô đã thấy bạn đang ngồi ở đầu bàn bên kia."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Giữa những trang giấy được tìm lại, bạn thấy lá thư gấp gửi từ nhà. Dòng cuối thật giản dị: “Ở đây vẫn còn một chỗ cho bạn.”"
