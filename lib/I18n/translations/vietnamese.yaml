STR_DRAUGHTS_HELP: "Chạm vào một quân cờ, sau đó chạm vào ô đích. Bắt buộc phải ăn quân; hoàn thành mọi bước nhảy. Quốc tế: 10x10, 20 quân, ăn quân lùi, vua bay và ăn quân tối đa. Brazil: luật ăn quân tương tự trên bàn 8x8 với 12 quân. Tây Ban Nha: quân thường ăn tiến, vua bay; ăn nhiều quân nhất, sau đó ăn nhiều vua nhất. Anh: vua ngắn, quân thường ăn tiến, bất kỳ chuỗi ăn quân đầy đủ nào. Đến hàng phong vua sẽ kết thúc lượt chơi Anh hoặc Tây Ban Nha. Chọn luật chơi, đối thủ và độ khó trong Cài đặt. Chế độ cục bộ cho phép hai người chia sẻ thiết bị đọc. Thay đổi luật chơi sẽ áp dụng cho trò chơi mới."
