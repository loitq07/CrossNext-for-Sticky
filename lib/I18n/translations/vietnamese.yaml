STR_CAR_GUIDE_EXAMPLE: "Ví dụ"
STR_CAR_GUIDE_EXAMPLE_COPY: "Nếu có 1 lời nói dối, chính xác một lời khai hoàn chỉnh là sai. Những lời khai khác là thật."
STR_CAR_GUIDE_OR: "A hoặc B đã làm"
STR_CAR_GUIDE_OR_COPY: "Ít nhất một người có tội; cả hai có thể có tội. Nếu đó là lời nói dối, không ai trong số họ đã làm."
STR_CAR_GUIDE_AND: "A và B đã làm"
STR_CAR_GUIDE_AND_COPY: "Cả hai đều có tội. Nếu đó là lời nói dối, ít nhất một người đã không làm."
STR_CAR_GUIDE_COMPARE: "Sự thành thật"
STR_CAR_GUIDE_COMPARE_COPY: "So sánh các lời khai, không phải tội lỗi. Cùng sự thành thật: cả hai đều thật hoặc cả hai đều dối. Khác sự thành thật: chính xác một lời khai là dối."
STR_CAR_GUIDE_NEIGHBOURS: "Hàng xóm"
