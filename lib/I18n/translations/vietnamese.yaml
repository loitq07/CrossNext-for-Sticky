STR_PET_RETIRE_HELP: "Hành trình này sẽ kết thúc. Khi bạn bắt đầu một trứng khác, tóm tắt, vật phẩm, vật tư, thuốc chữa và tiến độ dự án của nó vẫn được giữ nguyên. Các cảnh kỷ niệm chi tiết không được lưu trữ."
