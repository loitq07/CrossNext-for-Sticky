STR_QUEST_CAM_JOURNEY2_APPROACH_1: "Bạn tìm thấy cây đổ và sách rách. Một bầy sói canh chừng ngã tư phía trước."
STR_QUEST_CAM_JOURNEY2_APPROACH_2: "Cây cầu đã gãy và một người bảo vệ gốc rễ đứng trên những tấm ván còn sót lại."
STR_QUEST_CAM_JOURNEY2_APPROACH_3: "Ngôi nhà đầy những cuốn sách bị hư hỏng. Một con quái vật vỏ cây canh cửa và ngăn cản bạn tìm kiếm manh mối."
STR_QUEST_CAM_JOURNEY2_APPROACH_4: "Tấm bản đồ dẫn bạn tới một cái giếng cũ. Một con thú lao ra từ kẽ đá và chặn đường bạn."
STR_QUEST_CAM_JOURNEY2_APPROACH_5: "Bạn đi theo dấu vết dọc theo một con đường gần như bị chôn vùi trong cành cây. Một sinh vật bò về phía bạn từ giữa những cái cây."
STR_QUEST_CAM_JOURNEY2_APPROACH_6: "Bạn đến được tảng đá, nhưng một bầy sói đen đã vây quanh nó. Bạn không thể xem xét khi bầy sói còn ở đó."
STR_QUEST_CAM_JOURNEY2_APPROACH_7: "Những ngôi nhà đầu tiên hiện rõ ở phía xa. Một người bảo vệ trông chừng những rễ cây khổng lồ chắn đường."
STR_QUEST_CAM_JOURNEY2_APPROACH_8: "Bạn đến cánh cổng phủ đầy rễ cây. Một lính gác vỏ cây bước tới trước mặt nó."
