STR_CAR_GUIDE_SOLVE: "Cách giải một vụ án"
STR_CAR_GUIDE_SOLVE_COPY: "Phá một vụ án mạng bằng cách nghe các nhân vật và tìm ra thủ phạm. Mỗi vụ án cho biết cần tìm bao nhiêu thủ phạm và bao nhiêu lời khai sai."
STR_CAR_GUIDE_SINCERE: "Có tội và sự thành thật"
STR_CAR_GUIDE_SINCERE_COPY: "Có nhân vật nói thật, có nhân vật nói dối. Kẻ nói dối chưa chắc đã có tội: người vô tội cũng có thể nói dối."
STR_CAR_GUIDE_EXAMPLE: "Ví dụ"
STR_CAR_GUIDE_EXAMPLE_COPY: "Với 1 thủ phạm và 1 lời nói dối, hãy tìm đúng một nhân vật có tội và một lời khai sai. Mọi lời khai còn lại đều phải đúng."
STR_CAR_GUIDE_OR: "A hoặc B đã làm"
STR_CAR_GUIDE_OR_COPY: "“Ana hoặc Bruno là thủ phạm” nghĩa là ít nhất một người có tội. Nếu người nói đang nói dối, thì cả hai đều vô tội."
STR_CAR_GUIDE_AND: "A và B đã làm"
STR_CAR_GUIDE_AND_COPY: "“Ana và Bruno là thủ phạm” nghĩa là cả hai đều có tội. Nếu đó là lời nói dối, ít nhất một người vô tội."
STR_CAR_GUIDE_COMPARE: "Sự thành thật"
STR_CAR_GUIDE_COMPARE_COPY: "“Cả hai cùng nói thật hoặc cùng nói dối” so sánh lời khai, không phải tội. Hãy kiểm tra xem hai lời khai cùng đúng hay cùng sai."
STR_CAR_GUIDE_NEIGHBOURS: "Hàng xóm"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "Các manh mối trực tiếp nêu tên cả hai hàng xóm. Thay đổi trang không làm thay đổi mối quan hệ."
STR_CAR_GUIDE_RELIABLE: "Sự thật đáng tin cậy"
STR_CAR_GUIDE_RELIABLE_COPY: "Tên, chiều cao và chế độ ăn uống là đáng tin cậy. Lời khai có thể nói dối. Chiều cao là hư cấu."
STR_CAR_GUIDE_HEIGHT: "Chiều cao và chế độ ăn"
STR_CAR_GUIDE_HEIGHT_COPY: "Chiều cao và chế độ ăn của nhân vật là đáng tin. “Thủ phạm cao hơn tôi” so sánh thủ phạm với người nói. Động vật ăn tạp không tính là ăn thịt hay ăn cỏ."
STR_CAR_GUIDE_MARKS: "Ghi chú của bạn"
STR_CAR_GUIDE_MARKS_COPY: "Đọc từng lời khai. Dùng Thật, Dối và Nghi phạm để ghi lại suy đoán. Đây là ghi chú của bạn: trò chơi chưa kiểm tra chúng."
STR_CAR_GUIDE_NAV: "Điều hướng"
STR_CAR_GUIDE_NAV_COPY: "Có 3 nhân vật mỗi trang ở chế độ dọc. Các mũi tên hiển thị những người khác."
STR_CAR_GUIDE_CONFIRM: "Xác nhận cáo buộc"
STR_CAR_GUIDE_CONFIRM_COPY: "Khi suy đoán của bạn khớp mọi manh mối và số lời nói dối, hãy chạm Buộc tội. Chọn các thủ phạm và xác nhận câu trả lời."
STR_CAR_GUIDE_LIVES: "Mạng chơi và kết quả"
STR_CAR_GUIDE_LIVES_COPY: "Người mới/Bình thường: 2 mạng. Nâng cao/Chuyên gia: 1 mạng. Buộc tội đúng là phá được án. Khi hết mạng, bạn có thể xem lời giải."
STR_CAR_GUIDE_CAMPAIGN: "Chiến dịch"
STR_CAR_GUIDE_CAMPAIGN_COPY: "Mở vụ án để tiếp tục ván đang chơi. Chiến dịch cho phép chọn trong 1.470 vụ án. Khi mới học, hãy bắt đầu với Người mới."
STR_CAR_GUIDE_REPEAT: "Chơi lại và lưu"
STR_CAR_GUIDE_REPEAT_COPY: "Chơi lại vụ án sẽ bắt đầu lượt thử mới nhưng vẫn giữ kết quả trước đó. Tiến độ và số mạng được lưu trên thẻ microSD."
