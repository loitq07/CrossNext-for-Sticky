STR_PET_AFFECTION_SLEEP: "Một sự vuốt ve nhẹ nhàng để cùng bạn đồng hành nghỉ ngơi. Nghỉ ngơi giúp phục hồi năng lượng."
STR_PET_AFFECTION_HUNGRY: "Người bạn đồng hành của bạn rất thích tình cảm nhưng vẫn đói. Cho nó ăn trước khi chơi."
STR_PET_AFFECTION_TIRED: "Người bạn đồng hành của bạn chào đón một sự vuốt ve nhẹ nhàng. Nó vẫn cần nghỉ ngơi để phục hồi năng lượng."
STR_PET_AFFECTION_DIRTY: "Người bạn đồng hành của bạn rất thích chuyến thăm. Nó cũng cần được làm sạch để giữ sức khỏe."
STR_PET_AFFECTION_COMPANY: "Bạn đồng hành của bạn cần có người đồng hành. Một chút tình cảm sẽ giúp nó cảm thấy dễ chịu hơn."
STR_PET_AFFECTION_AGAIN: "Người bạn đồng hành của bạn rất vui được gặp bạn. Phần thưởng vuốt ve hôm nay đã được nhận."
STR_PET_AFFECTION_FULL: "Người bạn đồng hành của bạn rất thích chuyến thăm. Tâm trạng của nó đã ở mức tốt nhất rồi!"
