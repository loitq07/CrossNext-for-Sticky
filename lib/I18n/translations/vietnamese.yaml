STR_CAR_GUIDE_LIVES_COPY: "Người mới/Bình thường: 2 mạng chơi. Nâng cao/Chuyên gia: 1. Một cáo buộc đúng sẽ giải quyết vụ án. Khi không còn mạng chơi, xem giải pháp."
