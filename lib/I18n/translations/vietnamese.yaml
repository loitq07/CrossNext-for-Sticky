STR_INTERCEPT_CHOICE_2_2: "Trả lời một cách bình tĩnh"
STR_INTERCEPT_TITLE_3: "THÀNH PHẦN"
STR_INTERCEPT_TEXT_3: "Bên trong lớp lót áo khoác, ngón tay bạn chạm vào kim loại lạnh. Thành phần vẫn còn đó. Hooper nói lấy nó sẽ khiến việc tống tiền chấm dứt. Bây giờ cánh cửa bị khóa có một ý nghĩa khác."
STR_INTERCEPT_CHOICE_3_0: "Hãy giấu nó đi"
STR_INTERCEPT_CHOICE_3_1: "Đưa nó cho Harris"
STR_INTERCEPT_TITLE_4: "MỘT CHƠI CHIẾN THẮNG"
STR_INTERCEPT_TEXT_4: "Hợp tác có thể bảo vệ uy tín của bạn. Một lời nói dối thuyết phục có thể mua được thời gian. Việc trốn thoát sẽ đổi một căn phòng khóa kín cho lính canh bên ngoài. Không có động thái nào trong số này có thể được lấy lại."
STR_INTERCEPT_CHOICE_4_0: "Hợp tác"
STR_INTERCEPT_CHOICE_4_1: "Phát minh ra bằng chứng ngoại phạm"
STR_INTERCEPT_CHOICE_4_2: "Kiểm tra cửa sổ"
STR_INTERCEPT_TITLE_5: "TRÀ"
STR_INTERCEPT_TEXT_5: "Căn phòng nghiêng. Harris nhận thấy sự im lặng của bạn, nhưng khuôn mặt anh ấy đã lùi dần. Lần tiếp theo khi bạn mở mắt ra, một đôi giày khác đang đứng cạnh bàn."
STR_INTERCEPT_CHOICE_5_0: "Giả vờ vẫn đang ngủ"
STR_INTERCEPT_CHOICE_5_1: "Đối đầu với du khách"
STR_INTERCEPT_CHOICE_5_2: "Xin nước"
STR_INTERCEPT_TITLE_6: "MỘT SỰ TỪ CHỐI NHỎ"
STR_INTERCEPT_TEXT_6: "Bạn đẩy chiếc cốc đi. Harris theo dõi chuyển động kỹ hơn câu trả lời. Anh ta hỏi liệu có ai khác mà anh ta nên thẩm vấn không."
STR_INTERCEPT_CHOICE_6_0: "Hỏi anh ta có bằng chứng gì"
STR_INTERCEPT_CHOICE_6_1: "Đề cập đến Hooper"
STR_INTERCEPT_CHOICE_6_2: "Nhìn về phía cửa sổ"
STR_INTERCEPT_TITLE_7: "CUỘC THIẾU"
STR_INTERCEPT_TEXT_7: "Harris muốn một câu trả lời trực tiếp. Bạn đã lấy thành phần chưa? Bạn có thể cho anh ấy biết trong áo khoác của bạn có gì, giải thích áp lực mà Hooper đã gây ra hoặc cố gắng chỉ ra lời buộc tội ở nơi khác."
STR_INTERCEPT_CHOICE_7_0: "Đưa cho anh ta thành phần"
STR_INTERCEPT_CHOICE_7_1: "Giải thích vụ tống tiền"
STR_INTERCEPT_CHOICE_7_2: "Buộc tội Hooper"
STR_INTERCEPT_TITLE_8: "KIM LOẠI TRÊN BÀN"
STR_INTERCEPT_TEXT_8: "Thành phần nằm giữa bạn. Harris kiểm tra nó mà không hề thư giãn. Việc trả lại thiết bị bị đánh cắp không giải thích được lý do tại sao nó bị lấy đi. Anh ấy muốn một cái tên và một cái gì đó đáng tin cậy hơn lời nói của bạn."
STR_INTERCEPT_CHOICE_8_0: "Đề nghị tìm bằng chứng"
STR_INTERCEPT_CHOICE_8_1: "Ở lại và trả lời câu hỏi"
STR_INTERCEPT_TITLE_9: "ALIBI"
STR_INTERCEPT_TEXT_9: "Bạn mô tả một buổi tối yên tĩnh tại bàn làm việc của bạn. Harris mở tập tin. Một người bảo vệ đã nhìn thấy bạn rời khỏi phòng máy. Tài khoản bịa đặt của bạn hiện có nhân chứng chống lại nó."
STR_INTERCEPT_CHOICE_9_0: "Bảo vệ câu chuyện"
STR_INTERCEPT_CHOICE_9_1: "Thừa nhận hành vi tống tiền"
STR_INTERCEPT_CHOICE_9_2: "Từ chối các câu hỏi tiếp theo"
STR_INTERCEPT_TITLE_10: "CỬA SỔ"
STR_INTERCEPT_TEXT_10: "Cửa sổ cao và kính dày. Ngoài nó, con đường dẫn qua một túp lều khác. Phá vỡ nó sẽ ồn ào; chờ đợi ở đây có sự nguy hiểm riêng của nó."
STR_INTERCEPT_CHOICE_10_0: "Đập vỡ kính"
STR_INTERCEPT_CHOICE_10_1: "Nghiên cứu con đường bên ngoài"
STR_INTERCEPT_CHOICE_10_2: "Quay lại cuộc phỏng vấn"
STR_INTERCEPT_TITLE_11: "KHÁCH HÀNG KHÁC"
STR_INTERCEPT_TEXT_11: "Hooper đã đến trong khi bạn đang không vững. Anh ấy muốn biết liệu Harris có thành phần đó hay không. Anh ta giữ một tay gần cửa."
STR_INTERCEPT_CHOICE_11_0: "Giả vờ ngủ"
STR_INTERCEPT_CHOICE_11_1: "Yêu cầu một lời giải thích"
STR_INTERCEPT_CHOICE_11_2: "Xin nước"
STR_INTERCEPT_TITLE_12: "CẢNH BÁO"
STR_INTERCEPT_TEXT_12: "Bạn gọi Harris trước khi bữa tiệc diễn ra. Anh ta quay lại, cáu kỉnh. Lời buộc tội về chiếc cốc sẽ cần thứ gì đó mà anh ta có thể kiểm chứng."
STR_INTERCEPT_CHOICE_12_0: "Giữ chiếc cốc làm bằng chứng"
STR_INTERCEPT_CHOICE_12_1: "Buộc tội Harris đầu độc bạn"
STR_INTERCEPT_CHOICE_12_2: "Tập trung vào cuộn phim"
STR_INTERCEPT_TITLE_13: "HOPER"
STR_INTERCEPT_TEXT_13: "Harris nhận ra cái tên này. Hooper rất hữu ích, có kết nối tốt và cũng không vắng mặt trong danh sách đêm qua. Sự công nhận không phải là bằng chứng."
STR_INTERCEPT_CHOICE_13_0: "Tìm thứ gì đó có thể kiểm chứng được"
STR_INTERCEPT_CHOICE_13_1: "Khăng khăng Hooper đã đánh cắp nó"
STR_INTERCEPT_TITLE_14: "TÁC GIẢ"
STR_INTERCEPT_TEXT_14: "Bạn mô tả một chàng trai trẻ, niềm tin bị phản bội và yêu cầu theo sau đó. Harris lắng nghe mà không giúp đỡ bạn. Việc nêu tên người đặt bẫy cũng có thể vạch trần người mà bạn mong muốn bảo vệ."
STR_INTERCEPT_CHOICE_14_0: "Cung cấp cho Harris toàn bộ tài khoản"
STR_INTERCEPT_CHOICE_14_1: "Bỏ đi những cái tên"
STR_INTERCEPT_CHOICE_14_2: "Đề xuất cách bắt Hooper"
STR_INTERCEPT_TITLE_15: "MỘT Lời buộc tội DỄ DÀNG"
STR_INTERCEPT_TEXT_15: "Hooper, bạn nói, phải chịu trách nhiệm. Harris hỏi làm sao bạn biết. Có sự khác biệt giữa việc giải quyết vấn đề và việc tạo ra một nhân chứng có thể chứng minh câu trả lời."
STR_INTERCEPT_CHOICE_15_0: "Hãy để Harris thách thức yêu sách"
STR_INTERCEPT_CHOICE_15_1: "Hãy thử nhắn tin riêng cho Hooper"
STR_INTERCEPT_TITLE_16: "Một manh mối có thể kiểm tra được"
STR_INTERCEPT_TEXT_16: "Một câu chuyện có thể bị từ chối. Một tài liệu, một nhân chứng hoặc thành phần còn thiếu thì khó giải thích hơn. Bạn có một ít thời gian để lựa chọn những gì để theo đuổi."
STR_INTERCEPT_CHOICE_16_0: "Kiểm tra túp lều gần đó"
STR_INTERCEPT_CHOICE_16_1: "Sử dụng đánh chặn buổi sáng"
STR_INTERCEPT_CHOICE_16_2: "Hỏi trực tiếp Hooper"
STR_INTERCEPT_TITLE_17: "HƠN MỘT LỢI NHUẬN"
STR_INTERCEPT_TEXT_17: "Máy có thể hoạt động trở lại nhưng Harris vẫn có một lỗ hổng bảo mật cần giải thích. Anh ấy cho bạn một cơ hội cuối cùng để xác định ai đã tổ chức nó."
STR_INTERCEPT_CHOICE_17_0: "Hiển thị bằng chứng"
STR_INTERCEPT_CHOICE_17_1: "Tìm bằng chứng"
STR_INTERCEPT_CHOICE_17_2: "Chấp nhận sự phán xét của anh ấy"
STR_INTERCEPT_TITLE_18: "Mâu thuẫn"
STR_INTERCEPT_TEXT_18: "Harris đặt câu trả lời đầu tiên bên cạnh câu trả lời mới nhất của bạn. Cả hai đều không thể đúng. Bạn có thể từ bỏ lời nói dối hoặc để cuộc phỏng vấn kết thúc trong sự mâu thuẫn."
STR_INTERCEPT_CHOICE_18_0: "Nói sự thật về vụ tống tiền"
STR_INTERCEPT_CHOICE_18_1: "Tiếp tục phủ nhận mọi thứ"
STR_INTERCEPT_CHOICE_18_2: "Cố gắng rời đi"
STR_INTERCEPT_TITLE_19: "Im lặng"
STR_INTERCEPT_TEXT_19: "Bạn khoanh tay lại. Harris đóng tập tin lại. Trong căn phòng này, sự im lặng không kết thúc cuộc điều tra; nó chỉ kết thúc vai trò của bạn trong việc chỉ đạo nó."
STR_INTERCEPT_CHOICE_19_0: "Nghe quyết định"
STR_INTERCEPT_TITLE_20: "KÍNH VỠ"
STR_INTERCEPT_TEXT_20: "Cửa sổ nhường chỗ. Không khí lạnh và tiếng còi của lính canh hòa vào nhau. Có thời gian cho một quyết định trước khi ai đó đến cửa."
STR_INTERCEPT_CHOICE_20_0: "Chạy ra con đường bên ngoài"
STR_INTERCEPT_CHOICE_20_1: "Để lại manh mối được mã hóa"
STR_INTERCEPT_CHOICE_20_2: "Ở lại và giải thích"
STR_INTERCEPT_TITLE_21: "GIỮA CÁC TÚI LỰA"
STR_INTERCEPT_TEXT_21: "Con đường ướt át. Túp lều của Hooper đủ gần để có thể tiếp cận trước chuyến tuần tra tiếp theo, nhưng khu đất trống phía sau nó mang đến một loại cơ hội khác."
STR_INTERCEPT_CHOICE_21_0: "Cố gắng thoát khỏi căn cứ"
STR_INTERCEPT_CHOICE_21_1: "Đi vào túp lều của Hooper"
STR_INTERCEPT_CHOICE_21_2: "Trở lại Harris"
STR_INTERCEPT_TITLE_22: "TRÒ CHƠI RIÊNG TƯ"
STR_INTERCEPT_TEXT_22: "Hooper nghiên cứu bạn. Trên bàn, anh ta dùng ngón tay vẽ ra một thế cờ tưởng tượng. Một câu trả lời được mã hóa có thể khiến anh ta tiết lộ điều mà một lời buộc tội trực tiếp không bao giờ có thể làm được."
STR_INTERCEPT_CHOICE_22_0: "Trả lời bằng manh mối cờ vua"
STR_INTERCEPT_CHOICE_22_1: "Đe dọa khai tên anh ta"
STR_INTERCEPT_CHOICE_22_2: "Nói một cách trung thực"
STR_INTERCEPT_TITLE_23: "MẶT ĐỐI MẶT"
STR_INTERCEPT_TEXT_23: "Hooper hỏi bạn thực sự có thể chứng minh được điều gì. Sự tự tin của anh ấy chỉ chùn bước khi bạn đề cập đến những chi tiết mà người ngoài kế hoạch của anh ấy không nên biết."
STR_INTERCEPT_CHOICE_23_0: "Đối đầu với anh ta bằng bằng chứng"
STR_INTERCEPT_CHOICE_23_1: "Cung cấp thành phần như một giao dịch"
STR_INTERCEPT_CHOICE_23_2: "Vô tội vạ"
STR_INTERCEPT_TITLE_24: "CÚP"
STR_INTERCEPT_TEXT_24: "Hooper mang nước nhưng lại với lấy tách trà trước. Giữ chiếc cốc đó có thể hữu ích hơn là chấp nhận bất cứ thứ gì khác mà anh ấy đưa ra."
STR_INTERCEPT_CHOICE_24_0: "Giữ cốc"
STR_INTERCEPT_CHOICE_24_1: "Kiểm tra lại áo khoác của bạn"
STR_INTERCEPT_TITLE_25: "ĐIỀU GÌ ĐỂ KIỂM TRA"
STR_INTERCEPT_TEXT_25: "Bạn giữ chiếc cốc và yêu cầu Harris kiểm tra nó. Đây cuối cùng là một cáo buộc có đối tượng gắn liền với nó. Nỗ lực của Hooper nhằm loại bỏ nó cung cấp chi tiết hữu ích thứ hai."
STR_INTERCEPT_CHOICE_25_0: "Đưa cho Harris chiếc cốc"
STR_INTERCEPT_CHOICE_25_1: "Đối đầu với Hooper với nó"
STR_INTERCEPT_TITLE_26: "MỤC TIÊU SAI"
STR_INTERCEPT_TEXT_26: "Bạn buộc tội Harris mà không có bằng chứng. Anh ta nhìn thấy một nghi phạm đang cố gắng làm mất uy tín của điều tra viên. Dù chuyện gì đã xảy ra với trà, bạn đã khiến anh ấy khó tin bạn hơn."
STR_INTERCEPT_CHOICE_26_0: "Cuộc phỏng vấn kết thúc"
STR_INTERCEPT_TITLE_27: "TOÀN BỘ TÀI KHOẢN"
STR_INTERCEPT_TEXT_27: "Bạn cho biết tên và mô tả cuộc họp. Harris đặt những câu hỏi chính xác. Sự bối rối của bạn là có thật, nhưng giờ đây anh ấy có thể kiểm tra những chi tiết đó."
STR_INTERCEPT_CHOICE_27_0: "Hãy để anh ấy xác minh tài khoản"
STR_INTERCEPT_CHOICE_27_1: "Đề nghị tìm Hooper"
STR_INTERCEPT_TITLE_28: "MỘT LỪA ĐẢO THẤT BẠI"
STR_INTERCEPT_TEXT_28: "Harris đã nghe đủ câu trả lời đầy tự tin. Hooper cũng vậy. Cả hai đều không cung cấp sự thật rằng câu chuyện của bạn còn thiếu."
STR_INTERCEPT_CHOICE_28_0: "Kiên trì yêu cầu bồi thường"
STR_INTERCEPT_CHOICE_28_1: "Thực hiện một cuộc trốn thoát tuyệt vọng"
STR_INTERCEPT_CHOICE_28_2: "Thừa nhận những gì thực sự đã xảy ra"
STR_INTERCEPT_TITLE_29: "CHẶN LẠI"
STR_INTERCEPT_TEXT_29: "Tờ giấy trong túi của bạn chứa nhiều thứ hơn là những chữ cái lộn xộn: đường đi qua những túp lều đặt Hooper ở gần chiếc máy. Một manh mối ngắn gọn có thể giúp đúng người tìm đúng chỗ."
STR_INTERCEPT_CHOICE_29_0: "Mã hóa tin nhắn cho Hooper"
STR_INTERCEPT_CHOICE_29_1: "Hiển thị đường đi đến Harris"
STR_INTERCEPT_TITLE_30: "MÁY CHẠY"
STR_INTERCEPT_TEXT_30: "Harris có thành phần và dấu vết dẫn đến những câu trả lời đáng sợ đầu tiên của bạn. Bombe tiếp tục công việc của mình. Bạn rời khỏi Hut 14 dưới tên của chính mình, với ít bí mật hơn và vẫn còn một tương lai cần giải đáp."
STR_INTERCEPT_TITLE_31: "ĐANG NGHI NGỜ"
STR_INTERCEPT_TEXT_31: "Trả lại thành phần đã cứu máy khỏi bị trễ. Nó không lưu vị trí của bạn. Harris chấm dứt quyền tiếp cận các túp lều của bạn trong khi cuộc điều tra vẫn tiếp tục. Bạn đã sống sót sau cuộc phỏng vấn nhưng không xóa tên của mình."
STR_INTERCEPT_TITLE_32: "Đang bị giam giữ"
STR_INTERCEPT_TEXT_32: "Cánh cửa mở ra cho người bảo vệ hơn là cho bạn. Những mâu thuẫn, bằng chứng bị thiếu và một bộ phận bị đánh cắp đã trở thành một vụ án mà bạn không thể chỉ đạo được nữa. Nỗ lực này kết thúc ở đây."
STR_INTERCEPT_TITLE_33: "CON ĐƯỜNG NGOÀI"
STR_INTERCEPT_TEXT_33: "Bạn để lại những túp lều phía sau. Bóng tối rất hữu ích nhưng mặt đất vẫn được canh gác. Một cửa sổ bị vỡ đã đưa đội tuần tra đến gần hơn bạn mong đợi."
STR_INTERCEPT_CHOICE_33_0: "Băng qua vùng đất trống"
STR_INTERCEPT_CHOICE_33_1: "Đi theo con đường phục vụ"
STR_INTERCEPT_CHOICE_33_2: "Quay lại và đối mặt với Harris"
STR_INTERCEPT_TITLE_34: "TÚI CỦA HOOPER"
STR_INTERCEPT_TEXT_34: "Bàn làm việc không có người trông coi. Các tờ giấy nằm bên dưới một ô chữ và phòng máy xuất hiện theo một lịch trình được viết bằng bút chì. Tiếng bước chân tiến đến dọc theo tấm ván bên ngoài."
STR_INTERCEPT_CHOICE_34_0: "Kiểm tra giấy tờ"
STR_INTERCEPT_CHOICE_34_1: "Đợi Hooper"
STR_INTERCEPT_CHOICE_34_2: "Để lại cho Harris"
STR_INTERCEPT_TITLE_35: "VẤN ĐỀ CỜ"
STR_INTERCEPT_TEXT_35: "Bạn giao cho Hooper một vị trí phản ánh tình thế khó khăn của anh ta: một quân được bảo vệ, một quân vua bị lộ và một nước đi có vẻ an toàn cho đến khi có phản ứng. Anh ấy hiểu lời cảnh báo. Những lời tiếp theo của anh ấy cung cấp sự kết nối mà bạn cần."
STR_INTERCEPT_CHOICE_35_0: "Yêu cầu anh ta thừa nhận kế hoạch"
STR_INTERCEPT_CHOICE_35_1: "Gửi giấy nhập học tới Harris"
STR_INTERCEPT_TITLE_36: "KHÔNG CÓ MẶT NẠ"
STR_INTERCEPT_TEXT_36: "Bạn nói về áp lực thay vì giả vờ như nó chưa từng tồn tại. Hooper trả lời ngắn gọn với tư cách một con người hơn là một đối thủ. Việc mở cửa đó có thể được sử dụng để giao dịch hoặc bẫy."
STR_INTERCEPT_CHOICE_36_0: "Yêu cầu một sự sắp xếp trung thực"
STR_INTERCEPT_CHOICE_36_1: "Yêu cầu anh ấy thú nhận"
STR_INTERCEPT_CHOICE_36_2: "Mang tài khoản đến Harris"
STR_INTERCEPT_TITLE_37: "SỰ TUYỂN SINH CỦA HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper giải thích đủ để kết nối vụ tống tiền với thành phần còn thiếu. Harris hiện có thể khôi phục thiết bị và kiểm tra câu chuyện. Bạn phải quyết định có nên kết thúc cuộc điều tra hay để Hooper biến mất."
STR_INTERCEPT_CHOICE_37_0: "Mang cho Harris giấy nhập học"
STR_INTERCEPT_CHOICE_37_1: "Hãy để Hooper đi và rời đi"
STR_INTERCEPT_TITLE_38: "THƯƠNG MẠI"
STR_INTERCEPT_TEXT_38: "Bạn đặt đòn bẩy cuối cùng của mình trong tầm tay của Hooper. Một cuộc mặc cả không có nhân chứng hoặc bằng chứng là lời mời gọi anh ta giải quyết vấn đề của mình bằng chi phí của bạn."
STR_INTERCEPT_CHOICE_38_0: "Bàn giao thành phần"
STR_INTERCEPT_CHOICE_38_1: "Yêu cầu một thỏa thuận có chứng kiến"
STR_INTERCEPT_CHOICE_38_2: "Rút lại lời đề nghị"
STR_INTERCEPT_TITLE_39: "HARRIS LẮNG NGHE"
STR_INTERCEPT_TEXT_39: "Các chi tiết có thể được kiểm tra. Harris hỏi thành phần hiện ở đâu. Xóa tài khoản của bạn và khiến máy chạy là những vấn đề có liên quan nhưng chúng không giống nhau."
STR_INTERCEPT_CHOICE_39_0: "Trả lại những gì trong áo khoác của bạn"
STR_INTERCEPT_CHOICE_39_1: "Giúp phục hồi thành phần"
STR_INTERCEPT_CHOICE_39_2: "Dừng trả lời ngay bây giờ"
STR_INTERCEPT_TITLE_40: "NGOÀI HÀNG RÀO"
STR_INTERCEPT_TEXT_40: "Những túp lều biến mất sau lưng bạn. Tự do bên ngoài căn cứ không giống như sự vô tội, và chiếc máy bây giờ là vấn đề cấp bách của người khác. Bạn đã trốn thoát; tài khoản vẫn chưa hoàn thành."
STR_INTERCEPT_TITLE_41: "SAI LẦM CUỐI CÙNG"
STR_INTERCEPT_TEXT_41: "Đội tuần tra đến với bạn trước khi bãi đất trống kết thúc, hoặc lời hứa của Hooper sụp đổ khi nó không còn hữu ích với anh ta nữa. Bạn đã hết nước đi an toàn. Câu chuyện có thể được thử lại từ đầu."
STR_INTERCEPT_TITLE_42: "GIẤY TỜ"
STR_INTERCEPT_TEXT_42: "Lịch trình đặt Hooper ở vị trí mà câu chuyện của bạn nói đến. Bên cạnh đó là lời nhắn đầu tiên đã lôi bạn vào bẫy. Sự kết hợp này đủ cụ thể để Harris xác minh."
STR_INTERCEPT_CHOICE_42_0: "Mang giấy tờ đến cho Harris"
STR_INTERCEPT_CHOICE_42_1: "Chờ đợi và đối đầu với Hooper"
STR_INTERCEPT_TITLE_43: "MỘT SỰ SẮP XẾP CUỐI CÙNG"
STR_INTERCEPT_TEXT_43: "Hooper đề nghị đặt lại phần đó. Tin tưởng anh ta sẽ giải quyết được một vấn đề trước mắt; để Harris làm nhân chứng sẽ khiến việc tạo ra một nhân chứng khác trở nên khó khăn hơn."
STR_INTERCEPT_CHOICE_43_0: "Sắp xếp một sự trở lại có chứng kiến"
STR_INTERCEPT_CHOICE_43_1: "Đưa Harris vào kế hoạch"
STR_INTERCEPT_TITLE_44: "PHỤC HỒI CUỘC"
STR_INTERCEPT_TEXT_44: "Với tài khoản được ghi lại, tìm kiếm sẽ quay lại phần cứng bị thiếu. Harris kiểm tra phòng máy trong khi bạn xác định vị trí của bộ phận đó."
STR_INTERCEPT_CHOICE_44_0: "Hoàn tất việc trả lại đã được xác minh"
STR_INTERCEPT_CHOICE_44_1: "Lấy nó ra khỏi áo khoác của bạn"
STR_INTERCEPT_CHOICE_44_2: "Cảnh báo Harris về Hooper"
STR_INTERCEPT_TITLE_45: "CÂU HỎI CUỐI CÙNG"
STR_INTERCEPT_TEXT_45: "Harris chờ đợi. Nếu có thể kết nối Hooper với vụ trộm thì vẫn có cách để khôi phục thành phần đó và kết thúc việc này một cách hợp lý. Nếu không thì cuộc điều tra chỉ có tài khoản thay đổi của bạn."
STR_INTERCEPT_CHOICE_45_0: "Trình bày bằng chứng"
STR_INTERCEPT_CHOICE_45_1: "Hãy thừa nhận bạn không còn gì nữa"
STR_MYST_GUIDE_OBJECTIVE: "Mục tiêu của bạn"
STR_MYST_GUIDE_YOU: "Bạn: người giải mã"
STR_MYST_GUIDE_HOOPER: "Hooper"
STR_MYST_GUIDE_HARRIS: "Harris"
STR_MYST_GUIDE_SETTING: "Công viên Bletchley, 1942"
STR_MYST_GUIDE_YOU_ROLE: "Nhân vật bạn điều khiển"
STR_MYST_GUIDE_HOOPER_ROLE: "Đồng nghiệp và kẻ tống tiền của bạn"
STR_MYST_GUIDE_HARRIS_ROLE: "Điều tra viên"
STR_MYST_GUIDE_OBJECTIVE_COPY: "Một bộ phận của Bombe, một cỗ máy giải mã, bị mất tích. Bạn đang bị nghi ngờ. Giải thích những gì đã xảy ra, tìm bằng chứng và quyết định tin tưởng ai. Sự lựa chọn của bạn dẫn đến những kết thúc khác nhau."
STR_MYST_GUIDE_YOU_COPY: "Bạn giải mã các tin nhắn bí mật. Hooper đã tống tiền bạn để lấy thành phần Bombe. Bạn bắt đầu bị nhốt trong Túp lều 14, với bộ phận và một tin nhắn bị chặn trong áo khoác của bạn."
STR_MYST_GUIDE_HOOPER_COPY: "Hooper cũng làm việc tại Bletchley Park. Anh ta ép bạn phải tham gia và có lợi ích riêng. Bạn có thể thẩm vấn anh ta, thương lượng hoặc tìm kiếm bằng chứng. Biết vai trò của anh ấy không cho bạn biết lựa chọn nào là an toàn."
STR_MYST_GUIDE_HARRIS_COPY: "Harris hỏi bạn về thành phần còn thiếu. Anh ta kiểm tra tài khoản của bạn dựa trên bảng phân công nhiệm vụ và các bằng chứng khác. Anh ấy là người bạn phải thuyết phục; một lời buộc tội thôi không chứng minh được điều gì."
STR_MYST_HOW: "Nó hoạt động như thế nào"
STR_MYST_GUIDE_CHOICES: "Đọc, sau đó chọn câu trả lời hoặc hành động. Không có giới hạn thời gian."
STR_MYST_PAGES: "Sử dụng các mũi tên khi một cảnh có nhiều trang."
STR_MYST_SAVES: "Mọi quyết định đều lưu lại tiến trình của bạn."
STR_MYST_CREDIT_COPY: "Bản chuyển thể ngắn của The Intercept, by inkle (2016). Giấy phép MIT.\nDự án bao gồm kịch bản gốc và giấy phép của nó. Hình minh họa\nđược tạo cho phần sụn này."
