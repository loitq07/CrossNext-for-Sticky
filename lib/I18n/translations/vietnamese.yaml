STR_QUEST_CAM_DECOR_NAME_0: "Nàng Tiên Rừng"
STR_QUEST_CAM_DECOR_TEXT_0: "Bạn đã giải thoát nàng tiên khỏi những rễ cây câm lặng. Nàng sẽ mang một chút diệu kỳ tới ngôi nhà của bạn."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Đèn lồng rừng"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Một chiếc đèn lồng để chiếu sáng góc đọc sách của bạn."
STR_QUEST_CAM_DECOR_NAME_2: "Vỏ ốc tiếng vọng"
STR_QUEST_CAM_DECOR_TEXT_2: "Một thủy thủ được cứu tặng bạn chiếc vỏ ốc vẫn còn vang tiếng hát của biển."
STR_QUEST_CAM_DECOR_NAME_3: "Thần Mực"
STR_QUEST_CAM_DECOR_TEXT_3: "Một linh hồn thoát ra từ trang giấy trắng. Nó chọn đi cùng bạn."
STR_QUEST_CAM_DECOR_NAME_4: "Hoa trăng"
STR_QUEST_CAM_DECOR_TEXT_4: "Những người làm vườn đã cứu được một hạt giống từ khu vườn say ngủ. Bông hoa này nở ra cho bạn."
STR_QUEST_CAM_DECOR_NAME_5: "Pha Lê Mùa Đông"
STR_QUEST_CAM_DECOR_TEXT_5: "Băng tan để lộ một viên pha lê chứa ký ức cuối cùng của ngọn núi."
STR_QUEST_CAM_DECOR_NAME_6: "Cú đồng hồ"
STR_QUEST_CAM_DECOR_TEXT_6: "Người thợ đồng hồ sửa lại chú hộ vệ nhỏ này để cảm ơn bạn đã đưa thời gian trở lại."
STR_QUEST_CAM_DECOR_NAME_7: "Lông phượng hoàng"
STR_QUEST_CAM_DECOR_TEXT_7: "Từ đống tro tàn mọc lên một chiếc lông vũ: lời hứa rằng những câu chuyện có thể bắt đầu lại."
STR_QUEST_CAM_DECOR_NAME_8: "Đèn sa mạc"
STR_QUEST_CAM_DECOR_TEXT_8: "Một người kể chuyện tặng bạn ngọn đèn đã giữ cho những câu chuyện sa mạc còn sống mãi."
STR_QUEST_CAM_DECOR_NAME_9: "Cá Koi Mây"
STR_QUEST_CAM_DECOR_TEXT_9: "Bạn mở chiếc lồng mây. Một chú cá koi nhỏ ở lại canh giữ những giấc mơ của bạn."
STR_QUEST_CAM_DECOR_NAME_10: "Tim Rồng"
STR_QUEST_CAM_DECOR_TEXT_10: "Những con rồng trao cho bạn viên pha lê sinh ra từ ký ức chúng tìm lại được."
STR_QUEST_CAM_DECOR_NAME_11: "Ngôi sao ký ức"
STR_QUEST_CAM_DECOR_TEXT_11: "Ngôi sao đầu tiên được thắp lại soi đường cho bạn tới những trang cuối cùng."
STR_QUEST_CAM_DECOR_NAME_12: "Mầm đọc sách"
STR_QUEST_CAM_DECOR_TEXT_12: "Một chậu cây nhỏ cho góc đọc sách yên tĩnh."
STR_QUEST_CAM_DECOR_NAME_13: "Sách đã lưu"
STR_QUEST_CAM_DECOR_TEXT_13: "Những câu chuyện đang chờ độc giả tiếp theo."
STR_QUEST_CAM_DECOR_NAME_14: "Cờ hiệu lữ hành"
STR_QUEST_CAM_DECOR_TEXT_14: "Một lá cờ hiệu để ghi nhớ mỗi khởi đầu mới."
STR_QUEST_CAM_DECOR_NAME_15: "Nấm mặt trăng"
STR_QUEST_CAM_DECOR_TEXT_15: "Một mảnh rừng nhỏ cho ngôi nhà của bạn."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Khởi đầu cuộc phiêu lưu"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Suốt nhiều năm, mọi người sống trong yên bình và say mê những cuốn sách. Rồi Vua Lãng Quên bắt đầu hủy diệt chúng. Hắn muốn ngăn mọi người đọc sách và khiến mọi câu chuyện biến mất vĩnh viễn."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Quái vật của nhà vua"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Vua Lãng Quên phái lũ quái vật đi khắp thế giới. Chúng phá hủy mọi cuốn sách tìm thấy và tấn công bất cứ ai tìm cách ngăn cản. Thư viện dần biến mất, và mọi người thôi không đọc nữa."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Sức mạnh của việc đọc"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Một ngày nọ, khi bạn đang đọc sách gần ngôi làng của mình thì một con quái vật xuất hiện. Bạn cố gắng tránh xa, nhưng một điều đáng ngạc nhiên xảy ra: bạn càng đọc, nó càng trở nên yếu hơn. Bạn nhận ra rằng đọc sách là cách duy nhất để chống lại phép thuật của nhà vua."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Nhiệm vụ của bạn"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Bạn lên đường ngăn chặn nhà vua. Trên đường tới lâu đài của hắn, bạn phải băng qua rừng sâu, thành phố, núi non và nhiều nơi đầy rẫy kẻ thù. Mỗi con quái vật bạn đánh bại lại đưa bạn tới gần hơn một chút. Hãy tiếp tục đọc, đánh bại các hộ vệ và tới chỗ hắn trước khi hắn hủy diệt mọi cuốn sách trên đời."
