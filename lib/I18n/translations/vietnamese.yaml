STR_APP_RESOURCES_COPY: "Ứng dụng này cần nội dung để hoạt động. Giải nén CrossNext-Resources.zip vào thư mục gốc của thẻ nhớ microSD và thay thế thư mục hiển thị bên dưới. Khởi động lại máy đọc sách."
