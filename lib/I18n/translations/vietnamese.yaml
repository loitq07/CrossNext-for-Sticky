STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Hãy cùng tôi đọc lời kể này. Vẫn còn những gia đình đang tìm lại lời của chính họ trong cuốn sách của làng."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Hãy ở lại với những lời kể này thêm chút nữa. Ai đó ở chợ có thể nhận ra người mà những dòng chữ này mô tả."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Hãy cùng tôi đọc những cái tên này. Tôi muốn có một gia đình đứng chờ khi con thuyền tiếp theo cập bến."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Hãy đọc lời kể này trước khi tôi đưa nó lên kệ cao hơn. Tôi cần biết những chữ nào vẫn còn thiếu."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Hãy cùng tôi đọc lời của những lữ khách. Tôi không muốn nhầm một lời cảnh báo cũ thành lời gọi đi theo."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Hãy đọc những lời kể này bên đống lửa. Trước khi lên đường, tôi muốn mọi người được nghe tên của chính mình."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Hãy cùng tôi đọc trang này trước khi chuông reo. Tôi cần nhớ nhiều hơn là giờ trên mặt đồng hồ."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Hãy đọc trọn lời khai này. Có những người ở đây đã chờ quá lâu để được lắng nghe."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Hãy đọc ký ức này bên đài phun nước. Tôi muốn nghe người đã trồng cây ở đây mong để lại điều gì."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Hãy đọc những lời kể chúng tôi gửi bạn. Tiếng nói từ quê nhà có thể bầu bạn với bạn, dù ở xa đến thế."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Hãy đọc lá thư này trước khi lên đường. Bạn không phải mang mọi ký ức một mình."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Hãy đọc những lời chúng tôi giữ cho bạn. Pháo đài không phải là cả thế giới, dù nó có tĩnh lặng đến đâu."
