STR_PET_STORY_2: "Vị khách"
STR_PET_STORY_TEXT_2: "Một chú chim đậu bên cửa sổ. Bạn đồng hành của bạn lặng lẽ quan sát cho đến khi nó bay đi. Bạn đánh dấu trang sách và mỉm cười."
STR_PET_STORY_3: "Thuyền giấy"
STR_PET_STORY_TEXT_3: "Một mảnh giấy vụn trở thành một chiếc thuyền nhỏ. Bạn đồng hành của bạn dõi theo nó trên bàn, như thể nó chứa đựng cả một cuộc phiêu lưu."
STR_PET_STORY_4: "Dưới những vì sao"
STR_PET_STORY_TEXT_4: "Sau khi đọc sách, hai bạn cùng nhau nhìn ra ngoài. Một ngôi sao xuất hiện, rồi một ngôi sao khác. Vẫn còn rất nhiều điều để khám phá."
STR_PET_STORY_5: "Chiếc lá lạc"
STR_PET_STORY_TEXT_5: "Bạn đồng hành của bạn mang đến một chiếc lá. Bạn giữ nó bên cạnh dấu trang của mình: một món quà nhỏ từ một ngày bình thường."
STR_PET_STORY_6: "Một góc yên tĩnh"
STR_PET_STORY_TEXT_6: "Bạn tìm một góc thoải mái và mở sách ra. Bạn đồng hành của bạn nằm cạnh bạn. Cả hai đều không vội vàng."
STR_PET_STORY_7: "Một con đường mới"
STR_PET_STORY_TEXT_7: "Thêm một trang sách đưa bạn đến một nơi mới. Bạn đồng hành của bạn vươn vai và nhìn bạn, sẵn sàng cho chương sách ngày mai."
STR_PET_GAMES_SHORT: "Trò chơi"
STR_PET_NO_LIVES_TINY: "Chưa có các đời thú cưng trước."
STR_PET_HEALTH_HELP_SHORT: "Tắm rửa miễn phí. Chữa bệnh dùng một thuốc chữa. Đọc sách kiếm được tối đa hai thuốc chữa mỗi ngày."
