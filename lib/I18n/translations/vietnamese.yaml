STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Vuốt hoặc chạm vào mũi tên để điều khiển. Ăn thức ăn được viền để lớn lên. Tránh tường và đuôi của chính bạn. Bạn không thể đảo ngược hướng. Chạm Tạm dừng trước khi đặt thiết bị xuống. Các trò chơi đã lưu luôn tiếp tục ở trạng thái tạm dừng."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Bạn chơi quân đen. Chạm vào một ô trống để bẫy các quân trắng theo một đường thẳng. Tất cả các quân bị bẫy sẽ lật sang màu của bạn. Thiết bị chơi quân trắng. Nếu một bên không có nước đi hợp lệ, nó sẽ tự động bỏ qua. Bên có nhiều quân nhất sẽ thắng khi cả hai bên không thể di chuyển."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Tạo một vòng lặp kín. Mỗi số cho biết có bao nhiêu trong bốn cạnh của nó thuộc về vòng lặp. Chạm gần một cạnh để chuyển đổi giữa đường, dấu chéo và trống. Các đường không thể phân nhánh hoặc tạo thành các vòng lặp riêng biệt. Tất cả các gợi ý phải khớp. Bất kỳ giải pháp hợp lệ nào cũng được chấp nhận."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Kết nối tất cả các hòn đảo trong một mạng lưới. Số trên một hòn đảo là số cầu cần thiết của nó. Chạm vào hai hòn đảo lân cận trong cùng một hàng hoặc cột để chuyển đổi giữa một, hai và không cầu. Cầu không thể nhảy qua các hòn đảo. Bất kỳ giải pháp kết nối nào khớp với tất cả các số đều thắng."
