STR_PET_DEER: "Hươu"
STR_PET_LEOPARD: "Báo tuyết"
STR_PET_UNICORN: "Kỳ lân"
STR_PET_GRIFFIN: "Chim ưng mình sư tử"
STR_PET_PHOENIX: "Phượng hoàng"
STR_PET_PEGASUS: "Ngựa thần có cánh"
STR_PET_WYVERN: "Rồng hai chân"
STR_PET_EASTERN: "Rồng phương Đông"
STR_PET_WESTERN: "Rồng phương Tây"
STR_PET_MOON: "Rồng mặt trăng"
STR_PET_CRYSTAL: "Rồng pha lê"
STR_PET_CELESTIAL: "Rồng thiên thể"
STR_INTERCEPT_TITLE_0: "TÚP LỀU 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Bạn đang bị giữ chờ sau một cánh cửa khóa. Một linh kiện từ cỗ máy tính toán đã biến mất. Bản tin chặn buổi sáng sột soạt trong túi áo khoác của bạn. Bên ngoài, tiếng bước chân dừng lại."
STR_INTERCEPT_CHOICE_0_0: "Suy nghĩ về lời buộc tội"
STR_INTERCEPT_CHOICE_0_1: "Chờ người phỏng vấn"
STR_INTERCEPT_CHOICE_0_2: "Kiểm tra áo khoác của bạn"
STR_INTERCEPT_TITLE_1: "LỜI BUỘC TỘI"
STR_INTERCEPT_TEXT_1: "Họ nghi ngờ tội phản quốc. Bạn giải quyết các con số, ô chữ và thế cờ để kiếm sống. Căn phòng này là một vấn đề khác: tự mâu thuẫn, và uy tín của bạn có thể là nạn nhân đầu tiên."
STR_INTERCEPT_CHOICE_1_0: "Chọn một chiến lược"
STR_INTERCEPT_CHOICE_1_1: "Nghe những gì họ biết"
STR_INTERCEPT_TITLE_2: "HARRIS ĐẾN"
STR_INTERCEPT_TEXT_2: "Harris bước vào với một tách trà và một tập hồ sơ. Một cuộn băng đã biến mất khỏi Cỗ máy Bombe. Tên bạn có trong danh sách trực. Anh ta đặt tách trà bên cạnh bạn và hỏi bạn đã ở đâu đêm qua."
STR_INTERCEPT_CHOICE_2_0: "Uống trà"
STR_INTERCEPT_CHOICE_2_1: "Để nguyên tách trà"
STR_INTERCEPT_CHOICE_2_2: "Trả lời bình tĩnh"
STR_INTERCEPT_TITLE_3: "LINH KIỆN"
STR_INTERCEPT_TEXT_3: "Bên trong lớp lót áo khoác, ngón tay bạn chạm vào kim loại lạnh. Linh kiện vẫn còn đó. Hooper nói rằng việc lấy nó sẽ chấm dứt sự tống tiền. Giờ đây, cánh cửa bị khóa mang một ý nghĩa khác."
STR_INTERCEPT_CHOICE_3_0: "Giữ kín"
STR_INTERCEPT_CHOICE_3_1: "Giao nộp cho Harris"
STR_INTERCEPT_TITLE_4: "MỘT NƯỚC ĐI THẮNG LỢI"
STR_INTERCEPT_TEXT_4: "Hợp tác có thể giữ vững uy tín của bạn. Một lời nói dối thuyết phục có thể câu giờ. Trốn thoát sẽ đổi một căn phòng bị khóa lấy những người lính gác bên ngoài. Không nước đi nào có thể rút lại."
STR_INTERCEPT_CHOICE_4_0: "Hợp tác"
STR_INTERCEPT_CHOICE_4_1: "Tạo ra một chứng cứ ngoại phạm"
STR_INTERCEPT_CHOICE_4_2: "Kiểm tra cửa sổ"
STR_INTERCEPT_TITLE_5: "TRÀ"
STR_INTERCEPT_TEXT_5: "Căn phòng chao đảo. Harris nhận thấy sự im lặng của bạn, nhưng khuôn mặt anh ta đã mờ dần. Khi bạn mở mắt lần nữa, một đôi giày khác đang đứng cạnh bàn."
STR_INTERCEPT_CHOICE_5_0: "Giả vờ vẫn ngủ"
STR_INTERCEPT_CHOICE_5_1: "Đối mặt với vị khách"
STR_INTERCEPT_CHOICE_5_2: "Xin nước"
STR_INTERCEPT_TITLE_6: "MỘT LỜI TỪ CHỐI NHỎ"
STR_INTERCEPT_TEXT_6: "Bạn đẩy tách trà ra. Harris quan sát cử động đó kỹ hơn câu trả lời. Anh ta hỏi liệu có ai khác mà anh ta nên thẩm vấn không."
STR_INTERCEPT_CHOICE_6_0: "Hỏi anh ta có bằng chứng gì"
STR_INTERCEPT_CHOICE_6_1: "Nhắc đến Hooper"
STR_INTERCEPT_CHOICE_6_2: "Nhìn về phía cửa sổ"
STR_INTERCEPT_TITLE_7: "CUỘN BĂNG MẤT TÍCH"
STR_INTERCEPT_TEXT_7: "Harris muốn một câu trả lời trực tiếp. Bạn có lấy linh kiện không? Bạn có thể nói cho anh ta biết thứ trong áo khoác của bạn, giải thích áp lực mà Hooper đã gây ra, hoặc cố gắng đổ lỗi cho người khác."
STR_INTERCEPT_CHOICE_7_0: "Đưa linh kiện cho anh ta"
STR_INTERCEPT_CHOICE_7_1: "Giải thích về vụ tống tiền"
STR_INTERCEPT_CHOICE_7_2: "Buộc tội Hooper"
STR_INTERCEPT_TITLE_8: "KIM LOẠI TRÊN BÀN"
STR_INTERCEPT_TEXT_8: "Linh kiện nằm giữa hai bạn. Harris kiểm tra nó mà không hề thả lỏng. Việc trả lại thiết bị bị đánh cắp không giải thích được tại sao nó lại bị lấy đi. Anh ta muốn một cái tên và một thứ gì đó đáng tin cậy hơn lời nói của bạn."
STR_INTERCEPT_CHOICE_8_0: "Đề nghị tìm bằng chứng"
STR_INTERCEPT_CHOICE_8_1: "Ở lại và trả lời câu hỏi"
STR_INTERCEPT_TITLE_9: "BẰNG CHỨNG NGOẠI PHẠM"
STR_INTERCEPT_TEXT_9: "Bạn mô tả một buổi tối yên tĩnh tại bàn làm việc của mình. Harris mở hồ sơ. Một người gác cổng đã nhìn thấy bạn rời khỏi phòng máy. Lời khai bịa đặt của bạn giờ đây có một nhân chứng chống lại."
STR_INTERCEPT_CHOICE_9_0: "Bảo vệ câu chuyện"
STR_INTERCEPT_CHOICE_9_1: "Thừa nhận bị tống tiền"
STR_INTERCEPT_CHOICE_9_2: "Từ chối trả lời thêm câu hỏi"
STR_INTERCEPT_TITLE_10: "CỬA SỔ"
STR_INTERCEPT_TEXT_10: "Cửa sổ cao và kính dày. Bên ngoài, con đường dẫn qua một túp lều khác. Phá vỡ nó sẽ gây ra tiếng động lớn; việc chờ đợi ở đây cũng có những mối nguy hiểm riêng."
STR_INTERCEPT_CHOICE_10_0: "Phá kính"
STR_INTERCEPT_CHOICE_10_1: "Quan sát con đường bên ngoài"
STR_INTERCEPT_CHOICE_10_2: "Quay lại cuộc phỏng vấn"
STR_INTERCEPT_TITLE_11: "MỘT VỊ KHÁCH KHÁC"
STR_INTERCEPT_TEXT_11: "Hooper đã đến khi bạn đang không ổn định. Anh ta muốn biết liệu Harris có linh kiện không. Anh ta giữ một tay gần cửa."
STR_INTERCEPT_CHOICE_11_0: "Giả vờ ngủ"
STR_INTERCEPT_CHOICE_11_1: "Yêu cầu giải thích"
STR_INTERCEPT_CHOICE_11_2: "Xin nước"
STR_INTERCEPT_TITLE_12: "MỘT LỜI CẢNH BÁO"
STR_INTERCEPT_TEXT_12: "Bạn gọi Harris trước khi trà ngấm. Anh ta quay lại, bực mình. Một lời buộc tội về chiếc cốc sẽ cần thứ gì đó anh ta có thể kiểm tra."
STR_INTERCEPT_CHOICE_12_0: "Giữ chiếc cốc làm bằng chứng"
STR_INTERCEPT_CHOICE_12_1: "Buộc tội Harris đầu độc bạn"
STR_INTERCEPT_CHOICE_12_2: "Tập trung vào cuộn băng"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris nhận ra cái tên. Hooper hữu ích, có nhiều mối quan hệ, và cũng không vắng mặt trong danh sách đêm qua. Sự nhận diện không phải là bằng chứng."
STR_INTERCEPT_CHOICE_13_0: "Tìm thứ gì đó có thể kiểm chứng"
STR_INTERCEPT_CHOICE_13_1: "Khẳng định Hooper đã đánh cắp nó"
STR_INTERCEPT_TITLE_14: "TỐNG TIỀN"
STR_INTERCEPT_TEXT_14: "Bạn mô tả một chàng trai trẻ, một sự tin tưởng bị phản bội, và yêu cầu sau đó. Harris lắng nghe mà không giúp đỡ bạn. Việc nêu tên người đã giăng bẫy cũng có thể làm lộ người bạn hy vọng bảo vệ."
STR_INTERCEPT_CHOICE_14_0: "Kể cho Harris toàn bộ câu chuyện"
STR_INTERCEPT_CHOICE_14_1: "Bỏ qua các cái tên"
STR_INTERCEPT_CHOICE_14_2: "Đề xuất cách bắt Hooper"
STR_INTERCEPT_TITLE_15: "MỘT LỜI BUỘC TỘI DỄ DÀNG"
STR_INTERCEPT_TEXT_15: "Bạn nói Hooper phải chịu trách nhiệm. Harris hỏi làm sao bạn biết. Có sự khác biệt giữa việc giải quyết một vấn đề và việc đưa ra một nhân chứng có thể chứng minh câu trả lời."
STR_INTERCEPT_CHOICE_15_0: "Để Harris chất vấn lời khai"
STR_INTERCEPT_CHOICE_15_1: "Thử gửi tin nhắn riêng cho Hooper"
STR_INTERCEPT_TITLE_16: "MỘT MANH MỐI CÓ THỂ KIỂM CHỨNG"
STR_INTERCEPT_TEXT_16: "Một câu chuyện có thể bị phủ nhận. Một tài liệu, một nhân chứng, hoặc linh kiện bị mất thì khó giải thích hơn. Bạn có một chút thời gian để chọn điều mình muốn theo đuổi."
STR_INTERCEPT_CHOICE_16_0: "Kiểm tra túp lều gần đó"
STR_INTERCEPT_CHOICE_16_1: "Sử dụng thông tin chặn được buổi sáng"
STR_INTERCEPT_CHOICE_16_2: "Trực tiếp chất vấn Hooper"
STR_INTERCEPT_TITLE_17: "HƠN CẢ MỘT SỰ TRẢ LẠI"
STR_INTERCEPT_TEXT_17: "Cỗ máy có thể hoạt động trở lại, nhưng Harris vẫn phải giải thích về một vụ vi phạm an ninh. Anh ta cho bạn một cơ hội cuối cùng để xác định ai đã lên kế hoạch cho vụ việc."
STR_INTERCEPT_CHOICE_17_0: "Đưa ra bằng chứng"
STR_INTERCEPT_CHOICE_17_1: "Tìm kiếm bằng chứng"
STR_INTERCEPT_CHOICE_17_2: "Chấp nhận phán quyết của anh ta"
STR_INTERCEPT_TITLE_18: "MỘT SỰ MÂU THUẪN"
STR_INTERCEPT_TEXT_18: "Harris đặt câu trả lời đầu tiên của bạn bên cạnh câu trả lời mới nhất. Cả hai không thể cùng đúng. Bạn có thể từ bỏ lời nói dối, hoặc để cuộc phỏng vấn kết thúc trong mâu thuẫn."
STR_INTERCEPT_CHOICE_18_0: "Nói sự thật về vụ tống tiền"
STR_INTERCEPT_CHOICE_18_1: "Tiếp tục phủ nhận mọi thứ"
STR_INTERCEPT_CHOICE_18_2: "Cố gắng rời đi"
STR_INTERCEPT_TITLE_19: "IM LẶNG"
STR_INTERCEPT_TEXT_19: "Bạn khoanh tay. Harris đóng hồ sơ. Trong căn phòng này, sự im lặng không kết thúc cuộc điều tra; nó chỉ kết thúc vai trò chỉ đạo của bạn."
STR_INTERCEPT_CHOICE_19_0: "Nghe quyết định"
STR_INTERCEPT_TITLE_20: "KÍNH VỠ"
STR_INTERCEPT_TEXT_20: "Ô kính vỡ tan. Không khí lạnh và tiếng còi của lính gác cùng lúc vang lên. Có thời gian cho một quyết định trước khi ai đó đến cửa."
STR_INTERCEPT_CHOICE_20_0: "Chạy ra lối đi bên ngoài"
STR_INTERCEPT_CHOICE_20_1: "Để lại một manh mối được mã hóa"
STR_INTERCEPT_CHOICE_20_2: "Ở lại và giải thích"
STR_INTERCEPT_TITLE_21: "GIỮA CÁC TÚP LỀU"
STR_INTERCEPT_TEXT_21: "Con đường ẩm ướt. Túp lều của Hooper đủ gần để đến trước khi đội tuần tra tiếp theo, nhưng khu đất trống phía sau nó mang đến một cơ hội khác."
STR_INTERCEPT_CHOICE_21_0: "Cố gắng thoát khỏi khu vực"
STR_INTERCEPT_CHOICE_21_1: "Vào túp lều của Hooper"
STR_INTERCEPT_CHOICE_21_2: "Quay lại gặp Harris"
STR_INTERCEPT_TITLE_22: "MỘT TRÒ CHƠI RIÊNG TƯ"
STR_INTERCEPT_TEXT_22: "Hooper chăm chú quan sát bạn. Trên bàn, anh ta dùng ngón tay tạo ra một thế cờ vua tưởng tượng. Một câu trả lời được mã hóa có thể khiến anh ta tiết lộ điều mà một lời buộc tội trực tiếp sẽ không bao giờ làm được."
STR_INTERCEPT_CHOICE_22_0: "Trả lời bằng một manh mối cờ vua"
STR_INTERCEPT_CHOICE_22_1: "Đe dọa nêu tên anh ta"
STR_INTERCEPT_CHOICE_22_2: "Nói thật lòng"
STR_INTERCEPT_TITLE_23: "MẶT ĐỐI MẶT"
STR_INTERCEPT_TEXT_23: "Hooper hỏi bạn thực sự có thể chứng minh điều gì. Sự tự tin của anh ta chỉ lung lay khi bạn đề cập đến những chi tiết mà một người ngoài kế hoạch của anh ta không nên biết."
STR_INTERCEPT_CHOICE_23_0: "Đối chất với anh ta bằng bằng chứng"
STR_INTERCEPT_CHOICE_23_1: "Đề nghị đổi linh kiện"
STR_INTERCEPT_CHOICE_23_2: "Đánh lừa"
STR_INTERCEPT_TITLE_24: "CHIẾC CỐC"
STR_INTERCEPT_TEXT_24: "Hooper mang nước đến nhưng lại với lấy tách trà trước. Giữ chiếc cốc đó có thể hữu ích hơn là chấp nhận bất cứ thứ gì khác anh ta đưa ra."
STR_INTERCEPT_CHOICE_24_0: "Giữ chiếc cốc"
STR_INTERCEPT_CHOICE_24_1: "Kiểm tra lại áo khoác"
STR_INTERCEPT_TITLE_25: "THỨ CẦN KIỂM TRA"
STR_INTERCEPT_TEXT_25: "Bạn giữ chiếc cốc và yêu cầu Harris kiểm tra nó. Đây cuối cùng là một cáo buộc có vật chứng đi kèm. Nỗ lực loại bỏ nó của Hooper cung cấp một chi tiết hữu ích thứ hai."
STR_INTERCEPT_CHOICE_25_0: "Đưa chiếc cốc cho Harris"
STR_INTERCEPT_CHOICE_25_1: "Đối chất với Hooper bằng chiếc cốc"
STR_INTERCEPT_TITLE_26: "NHẦM MỤC TIÊU"
STR_INTERCEPT_TEXT_26: "Bạn buộc tội Harris mà không có bằng chứng. Anh ta thấy một nghi phạm đang cố gắng làm mất uy tín của điều tra viên. Dù chuyện gì đã xảy ra với trà, bạn đã khiến anh ta khó tin bạn hơn."
STR_INTERCEPT_CHOICE_26_0: "Cuộc phỏng vấn kết thúc"
STR_INTERCEPT_TITLE_27: "TOÀN BỘ LỜI KHAI"
STR_INTERCEPT_TEXT_27: "Bạn cung cấp tên và mô tả cuộc gặp. Harris đặt những câu hỏi chính xác. Sự bối rối của bạn là thật, nhưng những chi tiết anh ta có thể kiểm tra bây giờ cũng vậy."
STR_INTERCEPT_CHOICE_27_0: "Để anh ta xác minh lời khai"
STR_INTERCEPT_CHOICE_27_1: "Đề nghị tìm Hooper"
STR_INTERCEPT_TITLE_28: "MỘT CÚ LỪA THẤT BẠI"
STR_INTERCEPT_TEXT_28: "Harris đã nghe đủ những câu trả lời tự tin. Hooper cũng vậy. Cả hai đều không cung cấp sự thật mà câu chuyện của bạn còn thiếu."
STR_INTERCEPT_CHOICE_28_0: "Kiên trì với lời khai"
STR_INTERCEPT_CHOICE_28_1: "Thực hiện một cuộc trốn thoát tuyệt vọng"
STR_INTERCEPT_CHOICE_28_2: "Thừa nhận những gì thực sự đã xảy ra"
STR_INTERCEPT_TITLE_29: "SỰ ĐÁNH CHẶN"
STR_INTERCEPT_TEXT_29: "Tờ giấy trong túi bạn mang nhiều hơn những chữ cái lộn xộn: lộ trình của nó qua các túp lều đặt Hooper gần cỗ máy. Một manh mối ngắn gọn có thể khiến đúng người tìm đúng chỗ."
STR_INTERCEPT_CHOICE_29_0: "Mã hóa một tin nhắn cho Hooper"
STR_INTERCEPT_CHOICE_29_1: "Cho Harris xem lộ trình"
STR_INTERCEPT_TITLE_30: "CỖ MÁY HOẠT ĐỘNG"
STR_INTERCEPT_TEXT_30: "Harris có linh kiện, và một dấu vết dẫn xa hơn những câu trả lời sợ hãi ban đầu của bạn. Cỗ máy Bombe tiếp tục công việc của nó. Bạn rời Túp lều 14 dưới tên của mình, với ít bí mật hơn và một tương lai vẫn còn phải chịu trách nhiệm."
STR_INTERCEPT_TITLE_31: "BỊ NGHI NGỜ"
STR_INTERCEPT_TEXT_31: "Giao nộp lại linh kiện đã giúp cỗ máy tránh bị chậm trễ. Nó không cứu được vị trí của bạn. Harris chấm dứt quyền tiếp cận các túp lều của bạn trong khi cuộc điều tra tiếp tục. Bạn đã sống sót qua cuộc phỏng vấn, nhưng không làm trong sạch tên tuổi của mình."
STR_INTERCEPT_TITLE_32: "BỊ GIAM GIỮ"
STR_INTERCEPT_TEXT_32: "Cánh cửa mở ra cho lính gác chứ không phải cho bạn. Những mâu thuẫn, bằng chứng thiếu sót và một linh kiện bị đánh cắp đã trở thành một vụ án mà bạn không còn có thể chỉ đạo. Nỗ lực này kết thúc tại đây."
STR_INTERCEPT_TITLE_33: "CON ĐƯỜNG BÊN NGOÀI"
STR_INTERCEPT_TEXT_33: "Bạn bỏ lại những túp lều phía sau. Bóng tối hữu ích, nhưng khu đất đang bị canh gác. Một cửa sổ vỡ đã khiến các cuộc tuần tra đến gần hơn bạn mong đợi."
STR_INTERCEPT_CHOICE_33_0: "Băng qua khu đất trống"
STR_INTERCEPT_CHOICE_33_1: "Đi theo lối đi dịch vụ"
STR_INTERCEPT_CHOICE_33_2: "Quay lại và đối mặt với Harris"
STR_INTERCEPT_TITLE_34: "TÚP LỀU CỦA HOOPER"
STR_INTERCEPT_TEXT_34: "Bàn làm việc không có người. Giấy tờ nằm dưới một ô chữ, và phòng máy xuất hiện trong một lịch trình viết bằng bút chì. Tiếng bước chân đang đến gần dọc theo các tấm ván bên ngoài."
STR_INTERCEPT_CHOICE_34_0: "Kiểm tra giấy tờ"
STR_INTERCEPT_CHOICE_34_1: "Đợi Hooper"
STR_INTERCEPT_CHOICE_34_2: "Rời đi tìm Harris"
STR_INTERCEPT_TITLE_35: "MỘT VẤN ĐỀ CỜ VUA"
STR_INTERCEPT_TEXT_35: "Bạn đưa Hooper một thế cờ phản ánh tình cảnh của anh ta: một quân cờ được bảo vệ, một quân vua bị phơi bày, và một nước đi tưởng chừng an toàn cho đến khi có nước đáp trả. Anh ta hiểu lời cảnh báo. Những lời tiếp theo của anh ta cung cấp mối liên hệ bạn cần."
STR_INTERCEPT_CHOICE_35_0: "Yêu cầu anh ta thừa nhận kế hoạch"
STR_INTERCEPT_CHOICE_35_1: "Gửi lời thừa nhận cho Harris"
STR_INTERCEPT_TITLE_36: "KHÔNG MẶT NẠ"
STR_INTERCEPT_TEXT_36: "Bạn nói về áp lực thay vì giả vờ nó chưa từng tồn tại. Hooper trả lời ngắn gọn như một con người chứ không phải một đối thủ. Lối mở đó có thể được dùng để trao đổi, hoặc một cái bẫy."
STR_INTERCEPT_CHOICE_36_0: "Yêu cầu một thỏa thuận trung thực"
STR_INTERCEPT_CHOICE_36_1: "Yêu cầu anh ta thú tội"
STR_INTERCEPT_CHOICE_36_2: "Đưa lời khai cho Harris"
STR_INTERCEPT_TITLE_37: "LỜI THỪA NHẬN CỦA HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper giải thích đủ để liên kết vụ tống tiền với linh kiện bị mất. Harris giờ đây có thể thu hồi thiết bị và kiểm tra câu chuyện. Bạn phải quyết định liệu có kết thúc cuộc điều tra hay để Hooper biến mất."
STR_INTERCEPT_CHOICE_37_0: "Mang lời thừa nhận cho Harris"
STR_INTERCEPT_CHOICE_37_1: "Để Hooper đi và rời khỏi"
STR_INTERCEPT_TITLE_38: "SỰ TRAO ĐỔI"
STR_INTERCEPT_TEXT_38: "Bạn đặt quân bài cuối cùng của mình trong tầm với của Hooper. Một cuộc mặc cả không có nhân chứng hay bằng chứng là lời mời để anh ta giải quyết vấn đề của mình bằng cái giá của bạn."
STR_INTERCEPT_CHOICE_38_0: "Giao nộp linh kiện"
STR_INTERCEPT_CHOICE_38_1: "Yêu cầu một thỏa thuận có nhân chứng"
STR_INTERCEPT_CHOICE_38_2: "Rút lại lời đề nghị"
STR_INTERCEPT_TITLE_39: "HARRIS LẮNG NGHE"
STR_INTERCEPT_TEXT_39: "Các chi tiết có thể được kiểm tra. Harris hỏi linh kiện hiện đang ở đâu. Xóa bỏ tài khoản của bạn và làm cho cỗ máy hoạt động trở lại là những vấn đề liên quan, nhưng chúng không phải là một."
STR_INTERCEPT_CHOICE_39_0: "Trả lại thứ trong áo khoác của bạn"
STR_INTERCEPT_CHOICE_39_1: "Giúp thu hồi linh kiện"
STR_INTERCEPT_CHOICE_39_2: "Ngừng trả lời ngay bây giờ"
STR_INTERCEPT_TITLE_40: "VƯỢT QUA HÀNG RÀO"
STR_INTERCEPT_TEXT_40: "Những túp lều biến mất phía sau bạn. Tự do bên ngoài khu vực không giống như sự vô tội, và cỗ máy giờ là vấn đề cấp bách của người khác. Bạn đã trốn thoát; tài khoản vẫn chưa hoàn tất."
STR_INTERCEPT_TITLE_41: "SAI LẦM CUỐI CÙNG"
STR_INTERCEPT_TEXT_41: "Đội tuần tra đến chỗ bạn trước khi khu đất trống kết thúc, hoặc lời hứa của Hooper sụp đổ khi nó không còn hữu ích cho anh ta. Bạn đã hết những nước đi an toàn. Câu chuyện có thể được thử lại từ đầu."
STR_INTERCEPT_TITLE_42: "CÁC GIẤY TỜ"
STR_INTERCEPT_TEXT_42: "Lịch trình đặt Hooper ở nơi câu chuyện của bạn đã nói. Bên cạnh đó là ghi chú đã lần đầu tiên kéo bạn vào cái bẫy. Sự kết hợp đủ cụ thể để Harris xác minh."
STR_INTERCEPT_CHOICE_42_0: "Mang các giấy tờ cho Harris"
STR_INTERCEPT_CHOICE_42_1: "Chờ đợi và đối chất với Hooper"
STR_INTERCEPT_TITLE_43: "MỘT THỎA THUẬN CUỐI CÙNG"
STR_INTERCEPT_TEXT_43: "Hooper đề nghị đặt lại linh kiện. Tin tưởng anh ta sẽ loại bỏ một vấn đề trước mắt; biến Harris thành nhân chứng sẽ khiến việc tạo ra một vấn đề khác trở nên khó khăn hơn."
STR_INTERCEPT_CHOICE_43_0: "Sắp xếp một cuộc trả lại có nhân chứng"
STR_INTERCEPT_CHOICE_43_1: "Đưa Harris vào kế hoạch"
STR_INTERCEPT_TITLE_44: "THU HỒI CUỘN BĂNG"
STR_INTERCEPT_TEXT_44: "Với tài khoản đã được ghi lại, cuộc tìm kiếm quay trở lại phần cứng bị mất. Harris kiểm tra phòng máy trong khi bạn xác định vị trí linh kiện nên ở đâu."
STR_INTERCEPT_CHOICE_44_0: "Hoàn tất việc trả lại đã xác minh"
STR_INTERCEPT_CHOICE_44_1: "Lấy nó từ áo khoác của bạn"
STR_INTERCEPT_CHOICE_44_2: "Cảnh báo Harris về Hooper"
STR_INTERCEPT_TITLE_45: "CÂU HỎI CUỐI CÙNG"
STR_INTERCEPT_TEXT_45: "Harris chờ đợi. Nếu bạn có thể liên kết Hooper với vụ trộm, vẫn còn cách để thu hồi linh kiện và kết thúc vụ việc một cách đúng đắn. Nếu không, cuộc điều tra chỉ còn lại lời khai thay đổi của bạn."
STR_INTERCEPT_CHOICE_45_0: "Trình bày bằng chứng"
STR_INTERCEPT_CHOICE_45_1: "Thừa nhận bạn không còn gì nữa"
