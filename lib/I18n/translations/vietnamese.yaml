STR_CAR_INTRO: "Tội lỗi và sự trung thực là độc lập. Mỗi vụ án chỉ có một lời giải duy nhất. Chiều cao là đặc điểm nhân vật hư cấu."
STR_CAR_HELP_TEXT: "CÁCH GIẢI QUYẾT VỤ ÁN\nMỗi nhân vật đưa ra một lời khai. Phía trên màn hình hiển thị chính xác số lượng thủ phạm và lời khai sai. Tìm một sự kết hợp thỏa mãn cả hai số lượng này. Mỗi vụ án chỉ có một lời giải.\n\nTỘI LỖI KHÔNG ĐỒNG NGHĨA VỚI TRUNG THỰC\nMột nhân vật vô tội có thể nói dối, và một thủ phạm có thể nói thật. Hai lời nói dối có nghĩa là chính xác hai lời khai hoàn toàn sai; những lời khai khác là đúng. Đánh dấu Sự thật / Lời nói dối đề cập đến lời khai; Nghi phạm đề cập đến tội lỗi.\n\nĐỌC MANH MỐI\n\"A hoặc B đã làm điều đó (hoặc cả hai)\" có nghĩa là ít nhất một nhân vật được nêu tên là có tội. \"A và B đã làm điều đó\" yêu cầu cả hai. Một lời nói dối phủ nhận toàn bộ lời khai: một mệnh đề HOẶC sai có nghĩa là không ai làm điều đó; một mệnh đề VÀ sai có nghĩa là ít nhất một người đã không làm điều đó.\n\n\"Cả hai đều nói thật hoặc cả hai đều nói dối\" so sánh các lời khai, không phải tội lỗi. \"Chính xác một người đang nói dối\" có nghĩa là lời khai của họ có giá trị chân lý khác nhau. Những manh mối này bản thân chúng có thể đúng hoặc sai.\n\nHÀNG XÓM TRÊN MÀN HÌNH NHỎ\nThứ tự vòng tròn ban đầu là Báo, Công, Cá Mập, Cáo, Gấu, Nai Đực, Ngựa, chỉ sử dụng các nhân vật của vụ án này. Người cuối cùng và người đầu tiên là hàng xóm. Ứng dụng này ghi trực tiếp hai tên vào mỗi manh mối hàng xóm. Bạn không bao giờ cần phải đoán thẻ nào nằm cạnh một bức chân dung. Thay đổi trang hoặc hướng không làm thay đổi manh mối.\n\nCHIỀU CAO VÀ CHẾ ĐỘ ĂN\nMỗi thẻ hiển thị chiều cao và chế độ ăn hư cấu. \"Một thủ phạm cao hơn tôi\" có nghĩa là ít nhất một thủ phạm cao hơn người nói, không nhất thiết là tất cả các thủ phạm. Thấp hơn cũng tương tự. Manh mối về động vật ăn thịt và ăn cỏ có nghĩa là ít nhất một thủ phạm có chế độ ăn đó; động vật ăn tạp không được tính là cả hai. Tên, chiều cao và chế độ ăn là những sự thật đáng tin cậy; lời khai có thể nói dối.\n\nPHÂN TÍCH CỦA BẠN\nSử dụng ? / Sự thật / Lời nói dối và Nghi phạm dưới mỗi lời khai để ghi lại các giả thuyết. Đây là ghi chú của bạn, không phải bằng chứng hoặc kiểm tra tự động. Các mũi tên hiển thị các nhân vật khác. Chế độ chân dung hiển thị tối đa ba nhân vật mỗi trang.\n\nĐƯA RA LỜI BUỘC TỘI\nNhấn Buộc tội và chọn chính xác số lượng thủ phạm yêu cầu. Chỉ xác nhận một lời buộc tội sai mới làm mất một mạng chơi. Người mới bắt đầu và Bình thường có hai mạng chơi; Nâng cao và Chuyên gia có một mạng chơi. Một lời buộc tội đúng sẽ giải quyết vụ án. Khi hết mạng chơi, lời giải sẽ được tiết lộ.\n\nCHIẾN DỊCH VÀ CHƠI LẠI\nCó 1.470 vụ án. Mở vụ án sẽ tiếp tục lần thử hiện tại hoặc mở vụ án tiếp theo sau khi một vụ án đã đóng. Chiến dịch cho phép bạn chọn bất kỳ vụ án nào trong số 1.470 vụ án theo bất kỳ thứ tự nào từ đầu. Chơi lại bắt đầu một lần thử mới trong khi vẫn giữ lại tiến độ đã hoàn thành trước đó. Trong mỗi độ khó, các vụ án tiến triển từ một thủ phạm lên hai, sau đó từ ít kẻ nói dối hơn đến nhiều hơn trong mỗi nhóm thủ phạm. Người mới bắt đầu chỉ có một thủ phạm. Các nhóm nhân vật nhỏ hơn sẽ xuất hiện trước khi số lượng khớp. Tất cả các vụ án vẫn có sẵn. Giải quyết một vụ án đã hết mạng chơi trước đó sẽ nâng cấp nó thành đã giải quyết.\n\nTiến độ và mạng chơi được lưu trên thẻ SD. Rời đi, ngủ hoặc khởi động lại thiết bị không khôi phục mạng chơi trong lần thử hiện tại. Một lần lưu thất bại sẽ chặn kết quả cho đến khi Thử lại thành công. Đặt lại tất cả sẽ yêu cầu xác nhận trước khi xóa chỉ tiến độ của Carnivore."
