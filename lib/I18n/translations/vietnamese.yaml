STR_PET_DISCOVERY_REFERENCE: "Hình ảnh minh họa cho cột mốc này. Ngày và cảnh gốc không được ghi lại."
STR_PET_DISCOVERY_READING_TEXT: "Mỗi chương sách đưa hai bạn lại gần nhau hơn. Những giờ phút này thuộc về hành trình chung của hai bạn."
