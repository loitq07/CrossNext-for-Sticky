STR_PET_GUIDE_SATIETY: "Cho thú cưng ăn khi nó đói. Đọc sách giúp kiếm được tối đa 6 phần thức ăn mỗi ngày."
STR_PET_GUIDE_MOOD: "Vuốt ve và chơi cùng bạn đồng hành để làm nó vui lên. Đọc sách cũng cải thiện tâm trạng của nó."
STR_PET_GUIDE_ENERGY: "Trò chơi tiêu hao năng lượng. Chọn Nghỉ ngơi khi mệt: thú cưng của bạn sẽ nghỉ ngơi trong 2 giờ."
STR_PET_GUIDE_HYGIENE: "Tắm rửa miễn phí cho thú cưng để giúp ngăn ngừa bệnh tật. Nếu nó đã bị ốm, hãy cho nó uống thuốc chữa trong mục Sức khỏe."
STR_PET_GUIDE_READING: "Chọn một quả trứng và nuôi thú cưng của bạn bằng cách đọc sách. Cho nó ăn, bầu bạn, nghỉ ngơi và tắm rửa."
STR_PET_GUIDE_HOME: "Kiếm đồ trang trí bằng cách đọc sách. Đặt hoặc gỡ bỏ chúng tự do; bạn giữ mọi vật phẩm."
STR_PET_GUIDE_SUPPLIES: "Bạn kiếm được một phần thức ăn sau 5, 10, 15, 30, 60 và 120 phút đọc sách mỗi ngày: tối đa 6 phần. Một phần thức ăn giúp thú cưng no thêm 25 điểm."
STR_PET_GUIDE_FEED: "Bạn kiếm được một thuốc chữa sau 30 phút đọc sách và một thuốc chữa nữa sau 120 phút đọc sách mỗi ngày. Hãy dùng chúng trong mục Sức khỏe nếu thú cưng của bạn bị ốm."
STR_PET_GUIDE_GAMES: "3 trò chơi đầu tiên mỗi ngày sẽ thưởng tâm trạng và tốn 20 năng lượng. Sau đó, bạn có thể luyện tập tự do. Hãy chăm sóc thú cưng bị ốm, đói, mệt hoặc đang ngủ trước khi chơi."
STR_PET_GUIDE_HEALTH: "Tắm rửa miễn phí và khôi phục vệ sinh lên 100. Tắm rửa không chữa khỏi bệnh: để chữa bệnh, hãy mở mục Sức khỏe và dùng thuốc chữa."
STR_PET_GUIDE_DIFFICULTY: "Chế độ Thư giãn không có thời hạn quay lại đọc sách. Chế độ Bình thường cho phép 7 ngày, Khó 3 ngày và Cực khó 24 giờ. Nếu hết thời hạn, thú cưng của bạn sẽ chết. Đọc sách sẽ khởi động lại bộ đếm thời gian."
STR_PET_GUIDE_PROJECT: "Chọn một vật phẩm và đọc sách tối đa 60 phút để kiếm được nó. Thay đổi dự án sẽ bắt đầu lại từ đầu. Bạn có thể xóa các vật phẩm đã sở hữu mà không làm mất chúng; chúng sẽ được kế thừa."
