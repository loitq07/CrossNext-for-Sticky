STR_NAVAL_RIVAL_AFLOAT: "Đối thủ: %d / 5"
STR_NAVAL_OWN_HELP: "Vòng tròn: trượt. Ô vuông đen: trúng. Chọn Bàn cờ đối thủ để quay lại."
STR_NAVAL_TARGET_HELP: "Chọn một ô và xác nhận. Chạm vào bộ đếm hạm đội để chuyển đổi bàn cờ."
STR_NAVAL_BACK_TARGET: "Quay lại bảng mục tiêu"
STR_NAVAL_MY_BOARD: "Bàn cờ của tôi"
STR_NAVAL_RIVAL_BOARD: "Bàn cờ đối thủ"
