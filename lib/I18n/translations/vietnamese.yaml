STR_MYST_BACKGROUND: "Bạn là một chuyên gia giải mã tại Bletchley Park trong Thế chiến thứ hai.\n\nBạn bị tống tiền để đánh cắp một linh kiện của cỗ máy Bombe. Giờ đây, bạn đang bị thẩm vấn về sự biến mất của nó."
