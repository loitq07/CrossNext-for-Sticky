STR_PET_DISCOVERY_READING_TEXT: "Mỗi chương đều đưa bạn đến gần hơn. Những giờ này thuộc về cuộc sống này cùng nhau."
STR_PET_DISCOVERY_GAMES_TEXT: "Một thử thách chung, một chiến thắng nhỏ nữa. Luôn luôn có thời gian để chơi lại."
STR_PET_DISCOVERY_DAYS_TEXT: "Bạn tiếp tục quay lại với một câu chuyện khác. Thú cưng của bạn đã dành một chỗ cho bạn bên cạnh nó."
STR_PET_DISCOVERY_STREAK_TEXT: "Một ngày, rồi một ngày khác. Đọc đã trở thành một nghi thức nhỏ mà bạn chia sẻ."
STR_PET_MEMORY_CURES_TEXT: "Bạn đã giúp thú cưng của bạn phục hồi. Bộ nhớ này ghi lại các phương pháp điều trị đã hoàn thành bằng một phương pháp điều trị, tách biệt với việc làm sạch."
STR_PET_MEMORY_GAMES_TEXT: "Một chiến thắng chung! Cột mốc này bao gồm việc hoàn thành các trận đấu tập và bảo tồn ngôi nhà như thời điểm đó."
STR_PET_MEMORY_READING_TEXT: "Một cột mốc đọc sách khác cùng nhau. Bức ảnh này lưu giữ thú cưng của bạn và những đồ trang trí mà nó có khi cột mốc được ghi lại."
STR_PET_FIRST_HATCH_TEXT: "Người bạn đồng hành của bạn rời khỏi quả trứng và bắt đầu một giai đoạn mới."
STR_PET_MEMORY_HOME_TEXT: "Mỗi đồ vật bạn mở khóa sẽ trở thành một phần ngôi nhà của người bạn đồng hành của bạn."
STR_PET_FIRST_DAY_TEXT: "Ngày bạn chào đón người bạn đồng hành này. Câu chuyện chia sẻ của bạn bắt đầu từ một quả trứng."
STR_PET_FIRST_FOOD_TEXT: "Bạn đã cho người bạn đồng hành này ăn lần đầu tiên. Nguồn cung cấp đọc sách giúp bạn chăm sóc nó."
STR_PET_FIRST_STROKE_TEXT: "Bạn đã chia sẻ tình cảm với người bạn đồng hành này. Khoảnh khắc đó là một phần trong album của nó."
STR_PET_FIRST_HEALTH_TEXT: "Một khoảnh khắc chăm sóc sức khỏe và vệ sinh cho người bạn đồng hành của bạn."
STR_PET_MEMORY_BABY_TEXT: "Đọc sách đã giúp người bạn đồng hành của bạn lớn lên thành một em bé."
STR_PET_MEMORY_JUVENILE_TEXT: "Việc đọc được chia sẻ của bạn đã mở ra giai đoạn vị thành niên."
