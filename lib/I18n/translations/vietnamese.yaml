STR_PET_DISCOVERY_DAYS_TEXT: "Bạn cứ quay lại với một câu chuyện mới. Thú cưng đã dành sẵn cho bạn một chỗ bên cạnh."
STR_PET_DISCOVERY_STREAK_TEXT: "Ngày này qua ngày khác. Đọc sách trở thành một nghi thức nhỏ mà hai bạn chia sẻ."
STR_PET_MEMORIES_EMPTY: "Kỷ niệm của bạn sẽ xuất hiện ở đây khi bạn chia sẻ việc đọc sách, chăm sóc và trò chơi."
