STR_MYST_GUIDE_SETTING: "Bletchley Park, 1942"
STR_MYST_GUIDE_OBJECTIVE_COPY: "Một linh kiện của Cỗ máy Bombe, một cỗ máy giải mã, đã biến mất. Bạn đang bị tình nghi. Hãy giải thích chuyện gì đã xảy ra, tìm bằng chứng và quyết định xem nên tin tưởng ai. Các lựa chọn của bạn sẽ dẫn đến những kết thúc khác nhau."
STR_MYST_GUIDE_YOU: "Bạn: người giải mã"
STR_MYST_GUIDE_YOU_ROLE: "Nhân vật bạn điều khiển"
STR_MYST_GUIDE_YOU_COPY: "Bạn giải mã các tin nhắn bí mật. Hooper đã tống tiền bạn để lấy một linh kiện của Bombe. Bạn bắt đầu bị nhốt trong Túp lều 14, với linh kiện và một tin nhắn bị chặn trong áo khoác của mình."
STR_MYST_GUIDE_HARRIS: "Harris"
STR_MYST_GUIDE_HARRIS_ROLE: "Điều tra viên"
STR_MYST_GUIDE_HARRIS_COPY: "Harris thẩm vấn bạn về linh kiện bị mất. Anh ta đối chiếu lời khai của bạn với bảng phân công nhiệm vụ và các bằng chứng khác. Anh ta là người bạn phải thuyết phục; một lời buộc tội đơn thuần không chứng minh được điều gì."
STR_MYST_GUIDE_HOOPER: "Hooper"
STR_MYST_GUIDE_HOOPER_ROLE: "Đồng nghiệp và kẻ tống tiền bạn"
STR_MYST_GUIDE_HOOPER_COPY: "Hooper cũng làm việc tại Bletchley Park. Hắn đã gây áp lực buộc bạn lấy linh kiện và có những lợi ích riêng. Bạn có thể thẩm vấn hắn, thương lượng hoặc tìm kiếm bằng chứng. Biết vai trò của hắn không cho bạn biết lựa chọn nào là an toàn."
STR_MYST_GUIDE_CHOICES: "Đọc, sau đó chọn một câu trả lời hoặc hành động. Không có giới hạn thời gian."
