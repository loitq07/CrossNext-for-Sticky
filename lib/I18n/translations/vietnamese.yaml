STR_PET_GUIDE_PROJECT: "Chọn một món đồ và đọc tối đa 60 phút để nhận. Đổi dự án sẽ bắt đầu lại từ đầu. Bạn có thể gỡ món đồ đã có mà không mất nó; đồ vật được truyền lại cho thế hệ sau."
