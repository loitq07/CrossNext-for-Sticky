STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Bạn cầm quân đen. Chạm vào một ô trống kẹp được quân trắng theo đường thẳng. Mọi quân bị kẹp sẽ lật sang màu của bạn. Máy cầm quân trắng. Nếu một bên không có nước hợp lệ, bên đó tự động bỏ lượt. Khi cả hai bên đều hết nước, bên nhiều quân hơn thắng."
