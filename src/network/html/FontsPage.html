<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phông chữ - CrossNext</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
      --radius: 0.625rem;
      --sidebar-width: 250px;
    }
    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 5.5%;
      --card-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 14%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 50.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 17%;
      --input: 240 3.7% 17%;
      --ring: 240 4.9% 83.9%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
    }
    .app-shell { display: flex; width: 100%; position: relative; }

    /* Sidebar / Mobile Sheet */
    .sidebar {
      width: var(--sidebar-width); background: hsl(var(--card)); border-right: 1px solid hsl(var(--border));
      display: flex; flex-direction: column; flex-shrink: 0; padding: 1.25rem 1rem; gap: 1.5rem;
      transition: transform 0.25s ease; z-index: 100;
    }
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 90;
    }
    .sidebar-backdrop.show { display: block; }
    .brand-box { display: flex; align-items: center; gap: 0.75rem; padding: 0.25rem 0.5rem; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: calc(var(--radius) - 2px); background: hsl(var(--primary));
      color: hsl(var(--primary-foreground)); display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .brand-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
    .brand-sub { font-size: 0.75rem; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 0.35rem; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block; }

    .nav-section { display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      color: hsl(var(--muted-foreground)); padding: 0.5rem 0.75rem 0.25rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.75rem; border-radius: var(--radius);
      color: hsl(var(--muted-foreground)); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      transition: all 0.15s ease; cursor: pointer;
    }
    .nav-item:hover, .nav-item.active { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
    .nav-item.active { font-weight: 600; }

    .sidebar-footer {
      margin-top: auto; background: hsl(var(--secondary)); border: 1px solid hsl(var(--border));
      border-radius: var(--radius); padding: 0.85rem; font-size: 0.8rem;
    }
    .device-row { display: flex; justify-content: space-between; margin-bottom: 0.3rem; color: hsl(var(--muted-foreground)); }
    .device-row:last-child { margin-bottom: 0; }
    .device-val { font-weight: 600; color: hsl(var(--foreground)); font-family: ui-monospace, monospace; }

    /* Main Area */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 60px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--card));
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; gap: 0.75rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.5rem; }
    .mobile-menu-btn {
      display: none; width: 38px; height: 38px; border-radius: var(--radius); border: 1px solid hsl(var(--input));
      background: transparent; color: hsl(var(--foreground)); align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem;
    }
    .breadcrumbs {
      display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; white-space: nowrap;
    }
    .breadcrumbs a { color: hsl(var(--muted-foreground)); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem; }
    .breadcrumbs .sep { color: hsl(var(--muted-foreground)); font-size: 0.75rem; }
    .breadcrumbs .current { font-weight: 600; color: hsl(var(--foreground)); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; height: 36px; padding: 0 0.85rem;
      font-size: 0.825rem; font-weight: 500; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent;
      text-decoration: none; transition: all 0.15s ease;
    }
    .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
    .btn-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
    .btn-icon {
      width: 36px; height: 36px; padding: 0; border-radius: var(--radius); background: transparent;
      border: 1px solid hsl(var(--input)); color: hsl(var(--muted-foreground)); display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer; font-size: 1.05rem;
    }
    .btn-icon:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }

    .content-main { padding: 1.5rem; max-width: 900px; width: 100%; }
    .card {
      background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius);
      padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

    .family {
      border-bottom: 1px solid hsl(var(--border)); padding: 0.85rem 0;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .family:last-child { border-bottom: none; }
    .family-info { flex: 1; min-width: 0; }
    .family-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.2rem; }
    .family-meta { color: hsl(var(--muted-foreground)); font-size: 0.8rem; }

    .upload-form { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .upload-form input[type="file"] {
      flex: 1; min-width: 200px; padding: 0.5rem; background: hsl(var(--secondary) / 0.5);
      border: 1px dashed hsl(var(--border)); border-radius: var(--radius); color: hsl(var(--foreground));
      font-size: 0.85rem;
    }

    #status {
      margin-top: 1rem; padding: 0.75rem; border-radius: var(--radius); font-size: 0.85rem; display: none;
    }
    .status-ok { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); display: block !important; }
    .status-err { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); display: block !important; }
    .empty { color: hsl(var(--muted-foreground)); text-align: center; padding: 2rem; font-size: 0.9rem; }

    @media (max-width: 768px) {
      .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
      .content-main { padding: 1rem; }
      .topbar { padding: 0 0.75rem; }
    }
<!--#include file="shared/Responsive.css.inc" -->
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-box">
        <div class="brand-icon"><i class="ph ph-book-open"></i></div>
        <div>
          <div class="brand-title">CrossNext</div>
          <div class="brand-sub"><span class="status-dot"></span> Sticky e-Paper</div>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">Menu</div>
        <a class="nav-item" href="/files"><i class="ph ph-folder"></i><span>Truyền tập tin</span></a>
        <a class="nav-item" href="/settings"><i class="ph ph-gear-six"></i><span>Cài đặt</span></a>
        <a class="nav-item active" href="/fonts"><i class="ph ph-text-t"></i><span>Phông chữ</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-header">
          <div class="footer-status-pill">
            <span class="status-indicator" title="Trực tuyến"></span>
            <span class="footer-title">Thiết bị</span>
          </div>
          <span class="badge-ver" id="sbVersion">v1.4.11</span>
        </div>
        <div class="device-details">
          <div class="detail-row">
            <span class="detail-label"><i class="ph ph-cpu"></i> Phần cứng</span>
            <span class="detail-val device-name" id="sbDevice">Sticky</span>
          </div>
          <div class="detail-row ip-row" onclick="copyDeviceIp()" title="Nhấn để sao chép địa chỉ IP">
            <span class="detail-label"><i class="ph ph-wifi-high"></i> IP</span>
            <span class="detail-val ip-val"><span id="sbIp">192.168.0.174</span> <i class="ph ph-copy copy-icon"></i></span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Mở menu" aria-controls="sidebar" aria-expanded="false" onclick="toggleMobileSidebar()"><i class="ph ph-list"></i></button>
          <div class="breadcrumbs">
            <a href="/files"><i class="ph ph-house"></i> Home</a>
            <span class="sep"><i class="ph ph-caret-right"></i></span>
            <span class="current">Phông chữ</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Đổi giao diện Sáng/Tối">
            <i class="ph ph-sun" id="themeIcon"></i>
          </button>
        </div>
      </header>

      <main class="content-main">
        <div class="card">
          <h2><i class="ph ph-text-aa"></i> Phông chữ đã cài đặt</h2>
          <div id="families"><p class="empty">Đang tải danh sách phông chữ...</p></div>
        </div>

        <div class="card">
          <h2><i class="ph ph-upload-simple"></i> Cài đặt phông chữ mới</h2>
          <p style="font-size:0.825rem; color:hsl(var(--muted-foreground)); margin-bottom:1rem;">
            Chọn thư mục hoặc tệp chứa định dạng .cpfont, .ttf hoặc .otf để cài đặt lên thẻ nhớ.
          </p>
          <form class="upload-form" id="uploadForm">
            <label for="fontPickMode">Chọn theo</label><select id="fontPickMode"><option value="files">Tập tin</option><option value="folder">Thư mục</option></select>
            <input type="file" id="fontFiles" accept=".cpfont,.ttf,.otf" multiple required aria-label="Chọn tập tin phông chữ" />
            <button type="submit" class="btn btn-primary"><i class="ph ph-upload-simple"></i> Tải lên</button>
          </form>
          <p id="pickedInfo" class="family-meta" style="margin-top: 0.75rem;"></p>
          <div id="status"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
<!--#include file="shared/Responsive.js.inc" -->


    let currentTheme = localStorage.getItem('cp_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    function applyTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = t === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
    }
    applyTheme(currentTheme);
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('cp_theme', currentTheme);
      applyTheme(currentTheme);
    }

    async function fetchStatus() {
      try {
        const r = await fetch('/api/status');
        if (r.ok) {
          const d = await r.json();
          if (document.getElementById('sbDevice')) document.getElementById('sbDevice').textContent = d.device || 'Sticky';
          if (document.getElementById('sbVersion')) document.getElementById('sbVersion').textContent = 'v' + (d.version || '1.4.11');
          if (document.getElementById('sbIp')) document.getElementById('sbIp').textContent = d.ip || window.location.hostname;
        }
      } catch (e) {}
    }
    fetchStatus();


    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    // PSRAM boards also accept vector (.ttf/.otf) uploads; set from /api/fonts.
    let allowVector = false;

    function fontExtRe() {
      return allowVector ? /\.(cpfont|ttf|otf)$/i : /\.cpfont$/i;
    }

    function supportedExts() {
      return allowVector ? '.cpfont, .ttf or .otf' : '.cpfont';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allowVector = !!data.vectorFonts;
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'Chưa có phông chữ nào được cài đặt';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          // Vector families report size 0 (rendered at any size).
          const sizes = (f.sizes || []).filter(s => s > 0);
          const sizeText = sizes.length ? sizes.join(', ') + 'pt' : 'scalable';
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizeText + ' · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-destructive';
          btn.textContent = 'Xóa';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Không tải được danh sách phông chữ. Hãy tải lại trang.';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!confirm('Delete font family "' + name + '"?')) return;
      const status = document.getElementById('status');
      status.className = '';
      status.style.display = 'block';
      status.textContent = 'Deleting ' + name + '...';
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          status.className = 'status-ok';
          status.textContent = 'Deleted "' + name + '".';
        } else {
          status.className = 'status-err';
          status.textContent = 'Failed to delete "' + name + '".';
        }
      } catch (err) {
        status.className = 'status-err';
        status.textContent = 'Delete error: ' + err.message;
      }
      await loadFonts();
    }

    // Derive family name from a font filename: take everything before the
    // last '-' or '_' (that separator precedes the size suffix for .cpfont,
    // e.g. Bookerly_12.cpfont, or the style token for vector fonts, e.g.
    // Bookerly-Bold.ttf).
    function familyFromFilename(name) {
      const stem = name.replace(/\.(cpfont|ttf|otf)$/i, '');
      const cut = Math.max(stem.lastIndexOf('-'), stem.lastIndexOf('_'));
      return cut > 0 ? stem.slice(0, cut) : stem;
    }

    // Sanitize to match firmware's [A-Za-z0-9_-]+ pattern.
    function sanitizeFamily(raw) {
      return raw.replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function supportedFontFilesOnly(fileList) {
      return Array.from(fileList).filter(f => fontExtRe().test(f.name));
    }

    document.getElementById('fontPickMode').addEventListener('change', function() {
      const input = document.getElementById('fontFiles');
      input.toggleAttribute('webkitdirectory', this.value === 'folder');
      input.toggleAttribute('directory', this.value === 'folder');
      input.value = '';
      document.getElementById('pickedInfo').textContent = '';
    });

    document.getElementById('fontFiles').addEventListener('change', function() {
      const info = document.getElementById('pickedInfo');
      const files = supportedFontFilesOnly(this.files);
      if (files.length === 0) {
        info.textContent = 'No ' + supportedExts() + ' files found in the selected folder.';
        return;
      }
      const family = sanitizeFamily(familyFromFilename(files[0].name));
      info.textContent = files.length + ' file' + (files.length === 1 ? '' : 's') +
        ' → family "' + family + '"';
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      const files = supportedFontFilesOnly(document.getElementById('fontFiles').files);
      if (files.length === 0) {
        status.className = 'status-err';
        status.style.display = 'block';
        status.textContent = 'No ' + supportedExts() + ' files selected.';
        return;
      }

      // A directory picker may include files from multiple family subfolders.
      // Reject that up front — otherwise files[0]'s family is silently reused
      // for every upload, corrupting the install layout.
      const families = [...new Set(files.map(f => sanitizeFamily(familyFromFilename(f.name))))];
      if (families.length !== 1) {
        status.className = 'status-err';
        status.style.display = 'block';
        status.textContent = 'Please select files from a single font family.';
        return;
      }
      const family = families[0];

      status.className = '';
      status.style.display = 'block';

      let uploaded = 0;
      for (const file of files) {
        status.textContent = 'Uploading ' + (uploaded + 1) + '/' + files.length + ': ' + file.name;
        const formData = new FormData();
        formData.append('family', family);
        formData.append('file', file, file.name);
        try {
          const res = await fetch('/api/fonts/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (!data.ok) {
            status.className = 'status-err';
            status.textContent = 'Failed on ' + file.name + ': ' + (data.error || 'unknown error');
            await loadFonts();
            return;
          }
        } catch (err) {
          status.className = 'status-err';
          status.textContent = 'Upload error on ' + file.name + ': ' + err.message;
          await loadFonts();
          return;
        }
        uploaded++;
      }

      status.className = 'status-ok';
      status.textContent = 'Uploaded ' + uploaded + ' file' + (uploaded === 1 ? '' : 's') +
        ' to family "' + family + '".';
      await loadFonts();
    });

    loadFonts();

  </script>
</body>
</html>
