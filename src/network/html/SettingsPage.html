<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cài đặt - CrossNext</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23111'/%3E%3Cpath fill='%23fff' d='M3 3h6v2h-6zM15 3h6v2h-6zM1 5h2v10h-2zM9 5h2v2h-2zM13 5h2v2h-2zM21 5h2v10h-2zM11 7h2v10h-2zM15 7h2v1h-2zM15 8h3v1h-3zM16 9h3v1h-3zM17 10h3v1h-3zM16 11h3v1h-3zM15 12h3v1h-3zM15 13h2v1h-2zM1 15h8v2h-8zM15 15h8v2h-8zM9 17h2v2h-2zM13 17h2v2h-2zM11 19h2v2h-2z'/%3E%3C/svg%3E">
  <style>
<!--#include file="shared/PhosphorIcons.css.inc" -->
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
      --radius: 0.625rem;
      --sidebar-width: 250px;
    }
    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 5.5%;
      --card-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 14%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 50.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 17%;
      --input: 240 3.7% 17%;
      --ring: 240 4.9% 83.9%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
    }
    .app-shell { display: flex; width: 100%; position: relative; }

    /* Sidebar / Mobile Sheet */
    .sidebar {
      width: var(--sidebar-width); background: hsl(var(--card)); border-right: 1px solid hsl(var(--border));
      display: flex; flex-direction: column; flex-shrink: 0; padding: 1.25rem 1rem; gap: 1.5rem;
      transition: transform 0.25s ease; z-index: 100;
    }
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 90;
    }
    .sidebar-backdrop.show { display: block; }
    .brand-box { display: flex; align-items: center; gap: 0.75rem; padding: 0.25rem 0.5rem; }
    .brand-logo { width: 24px; height: 24px; display: block; shape-rendering: crispEdges; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: calc(var(--radius) - 2px); background: hsl(var(--primary));
      color: hsl(var(--primary-foreground)); display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .brand-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
    .brand-sub { font-size: 0.75rem; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 0.35rem; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block; }

    .nav-section { display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      color: hsl(var(--muted-foreground)); padding: 0.5rem 0.75rem 0.25rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.75rem; border-radius: var(--radius);
      color: hsl(var(--muted-foreground)); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      transition: all 0.15s ease; cursor: pointer;
    }
    .nav-item:hover, .nav-item.active { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
    .nav-item.active { font-weight: 600; }

    .sidebar-footer {
      margin-top: auto; background: hsl(var(--secondary)); border: 1px solid hsl(var(--border));
      border-radius: var(--radius); padding: 0.85rem; font-size: 0.8rem;
    }
    .device-row { display: flex; justify-content: space-between; margin-bottom: 0.3rem; color: hsl(var(--muted-foreground)); }
    .device-row:last-child { margin-bottom: 0; }
    .device-val { font-weight: 600; color: hsl(var(--foreground)); font-family: ui-monospace, monospace; }

    /* Main Area */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 60px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--card));
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; gap: 0.75rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.5rem; }
    .mobile-menu-btn {
      display: none; width: 38px; height: 38px; border-radius: var(--radius); border: 1px solid hsl(var(--input));
      background: transparent; color: hsl(var(--foreground)); align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem;
    }
    .breadcrumbs {
      display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; white-space: nowrap;
    }
    .breadcrumbs a { color: hsl(var(--muted-foreground)); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem; }
    .breadcrumbs .sep { color: hsl(var(--muted-foreground)); font-size: 0.75rem; }
    .breadcrumbs .current { font-weight: 600; color: hsl(var(--foreground)); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; height: 36px; padding: 0 0.85rem;
      font-size: 0.825rem; font-weight: 500; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent;
      text-decoration: none; transition: all 0.15s ease;
    }
    .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-outline { background: hsl(var(--background)); border-color: hsl(var(--input)); color: hsl(var(--foreground)); }
    .btn-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
    .btn-sm { height: 30px; padding: 0 0.6rem; font-size: 0.775rem; }
    .btn-icon {
      width: 36px; height: 36px; padding: 0; border-radius: var(--radius); background: transparent;
      border: 1px solid hsl(var(--input)); color: hsl(var(--muted-foreground)); display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer; font-size: 1.05rem;
    }
    .btn-icon:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }

    .content-main { padding: 1.5rem; padding-bottom: 5rem; max-width: 900px; width: 100%; margin-bottom: 0; }
    .card {
      background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius);
      padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    .setting-row {
      display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0;
      border-bottom: 1px solid hsl(var(--border)); gap: 1rem;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-name { font-size: 0.875rem; font-weight: 500; color: hsl(var(--foreground)); flex: 1; }
    .setting-control { flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem; }

    .setting-control select,
    .setting-control input[type="number"],
    .setting-control input[type="text"],
    .setting-control input[type="password"] {
      height: 36px; border: 1px solid hsl(var(--input)); border-radius: var(--radius);
      background: hsl(var(--background)); color: hsl(var(--foreground)); padding: 0 0.65rem;
      font-size: 0.85rem; outline: none;
    }
    .setting-control select { min-width: 140px; }
    .setting-control input[type="text"], .setting-control input[type="password"] { width: 180px; }
    .setting-control input[type="number"] { width: 80px; }

    /* Toggle switch */
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0; background-color: hsl(var(--muted));
      border-radius: 20px; transition: .2s;
    }
    .toggle-slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .toggle-slider { background-color: #10b981; }
    input:checked + .toggle-slider:before { transform: translateX(18px); }

    /* Sticky Save Bar */
    .save-bar {
      position: fixed; bottom: 0; left: var(--sidebar-width); right: 0;
      background: hsl(var(--card) / 0.95); backdrop-filter: blur(8px);
      border-top: 1px solid hsl(var(--border)); padding: 0.85rem 1.5rem;
      display: flex; justify-content: flex-end; align-items: center; gap: 1rem; z-index: 80;
    }

    .opds-server {
      border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 1rem; margin: 0.85rem 0;
      background: hsl(var(--secondary) / 0.3);
    }
    .opds-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; }

    .message {
      padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.85rem; display: none;
    }
    .message.success { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); display: block !important; }
    .message.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); display: block !important; }

    /* shadcn/ui Tabs Component */
    .tabs-wrapper {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid hsl(var(--border));
      padding-bottom: 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tabs-list {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: hsl(var(--secondary) / 0.5);
      border: 1px solid hsl(var(--border));
      padding: 0.25rem;
      border-radius: var(--radius);
      min-width: max-content;
    }
    .tab-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      height: 34px;
      padding: 0 0.85rem;
      font-size: 0.825rem;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      background: transparent;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
    }
    .tab-trigger:hover {
      color: hsl(var(--foreground));
      background: hsl(var(--secondary));
    }
    .tab-trigger.active {
      color: hsl(var(--foreground));
      background: hsl(var(--card));
      border-color: hsl(var(--border) / 0.8);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .tab-trigger i { font-size: 1rem; }
    .tab-unsaved-dot {
      width: 6px;
      height: 6px;
      background: #f59e0b;
      border-radius: 50%;
      margin-left: 0.2rem;
      display: inline-block;
    }
    .tab-pane { display: none; }
    .tab-pane.active {
      display: block;
      animation: tab-fade-in 0.15s ease-out;
    }
    @keyframes tab-fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-state {
      padding: 3rem 1.5rem;
      text-align: center;
      color: hsl(var(--muted-foreground));
      font-size: 0.875rem;
    }
    .spin-icon {
      font-size: 1.75rem;
      animation: spin 1s linear infinite;
      margin-bottom: 0.5rem;
      display: inline-block;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
      .save-bar { left: 0; }
      .content-main { padding: 1rem; }
      .tabs-wrapper {
        margin: -0.25rem -1rem 1.25rem -1rem;
        padding: 0 1rem 0.5rem 1rem;
      }
      .tab-trigger {
        height: 38px;
        font-size: 0.85rem;
        padding: 0 0.95rem;
      }
      .setting-row { flex-wrap: wrap; }
      .setting-control { width: 100%; justify-content: flex-end; }
    }
<!--#include file="shared/Responsive.css.inc" -->
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-box">
        <div class="brand-icon"><svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 3h6v2h-6zM15 3h6v2h-6zM1 5h2v10h-2zM9 5h2v2h-2zM13 5h2v2h-2zM21 5h2v10h-2zM11 7h2v10h-2zM15 7h2v1h-2zM15 8h3v1h-3zM16 9h3v1h-3zM17 10h3v1h-3zM16 11h3v1h-3zM15 12h3v1h-3zM15 13h2v1h-2zM1 15h8v2h-8zM15 15h8v2h-8zM9 17h2v2h-2zM13 17h2v2h-2zM11 19h2v2h-2z"/></svg></div>
        <div>
          <div class="brand-title">CrossNext</div>
          <div class="brand-sub"><span class="status-dot"></span> Sticky e-Paper</div>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">Menu</div>
        <a class="nav-item" href="/files"><i class="ph ph-folder"></i><span>Truyền tập tin</span></a>
        <a class="nav-item active" href="/settings"><i class="ph ph-gear-six"></i><span>Cài đặt</span></a>
        <a class="nav-item" href="/fonts"><i class="ph ph-text-t"></i><span>Phông chữ</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-header">
          <div class="footer-status-pill">
            <span class="status-indicator" title="Trực tuyến"></span>
            <span class="footer-title">Thiết bị</span>
          </div>
          <span class="badge-ver" id="sbVersion" onclick="openWhatsNewModal()" title="Nhấn để xem tính năng mới trong v1.4.12">v1.4.12</span>
        </div>
        <div class="device-details">
          <div class="detail-row">
            <span class="detail-label"><i class="ph ph-cpu"></i> Phần cứng</span>
            <span class="detail-val device-name" id="sbDevice">Sticky</span>
          </div>
          <div class="detail-row ip-row" onclick="copyDeviceIp()" title="Nhấn để sao chép địa chỉ IP">
            <span class="detail-label"><i class="ph ph-wifi-high"></i> IP</span>
            <span class="detail-val ip-val"><span id="sbIp">192.168.0.174</span> <i class="ph ph-copy copy-icon"></i></span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Mở menu" aria-controls="sidebar" aria-expanded="false" onclick="toggleMobileSidebar()"><i class="ph ph-list"></i></button>
          <div class="breadcrumbs">
            <a href="/files"><i class="ph ph-house"></i> Home</a>
            <span class="sep"><i class="ph ph-caret-right"></i></span>
            <span class="current">Cài đặt</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline btn-sm" id="whatsNewBtn" onclick="openWhatsNewModal()" title="Xem tính năng mới trong v1.4.12">
            <i class="ph ph-sparkle"></i> <span>Có gì mới?</span>
          </button>
          <button class="btn btn-primary btn-sm" id="topSaveBtn" onclick="saveSettings()" disabled>
            <i class="ph ph-floppy-disk"></i> <span>Lưu cài đặt</span>
          </button>
          <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Đổi giao diện Sáng/Tối">
            <i class="ph ph-sun" id="themeIcon"></i>
          </button>
        </div>
      </header>

      <main class="content-main">
        <div id="message" class="message"></div>

        <!-- Tabs Navigation (shadcn TabsList style) -->
        <div class="tabs-wrapper">
          <div class="tabs-list" role="tablist">
            <button class="tab-trigger active" role="tab" data-tab="reader" onclick="switchTab('reader')">
              <i class="ph ph-book-open"></i><span>Trình đọc</span>
            </button>
            <button class="tab-trigger" role="tab" data-tab="display" onclick="switchTab('display')">
              <i class="ph ph-sun"></i><span>Hiển thị</span>
            </button>
            <button class="tab-trigger" role="tab" data-tab="controls" onclick="switchTab('controls')">
              <i class="ph ph-sliders"></i><span>Điều khiển</span>
            </button>
            <button class="tab-trigger" role="tab" data-tab="system" onclick="switchTab('system')">
              <i class="ph ph-gear-six"></i><span>Hệ thống</span>
            </button>
            <button class="tab-trigger" role="tab" data-tab="wifi" onclick="switchTab('wifi')">
              <i class="ph ph-wifi-high"></i><span>Wi-Fi</span>
            </button>
            <button class="tab-trigger" role="tab" data-tab="services" onclick="switchTab('services')">
              <i class="ph ph-cloud-arrow-down"></i><span>Dịch vụ & Plugin</span>
            </button>
          </div>
        </div>

        <div id="settings-container">
          <div id="tab-pane-reader" class="tab-pane active" role="tabpanel">
            <div id="settings-reader">
              <div class="loading-state">
                <i class="ph ph-spinner-gap spin-icon"></i>
                <div>Đang tải cài đặt thiết bị...</div>
              </div>
            </div>
          </div>

          <div id="tab-pane-display" class="tab-pane" role="tabpanel">
            <div id="settings-display"></div>
          </div>

          <div id="tab-pane-controls" class="tab-pane" role="tabpanel">
            <div id="settings-controls"></div>
          </div>

          <div id="tab-pane-system" class="tab-pane" role="tabpanel">
            <div id="settings-system"></div>
          </div>

          <div id="tab-pane-wifi" class="tab-pane" role="tabpanel">
            <div id="wifi-container"></div>
          </div>

          <div id="tab-pane-services" class="tab-pane" role="tabpanel">
            <div id="opds-container"></div>
            <div id="plugin-container"></div>
          </div>

          <div id="settings-fallback"></div>
        </div>
      </main>

      <div class="save-bar" id="save-container" style="display:none;">
        <span style="font-size:0.85rem; color:hsl(var(--muted-foreground));">Có thay đổi chưa được lưu</span>
        <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()" disabled>
          <i class="ph ph-floppy-disk"></i> Lưu thay đổi
        </button>
      </div>
    </div>
  </div>

  <script>
<!--#include file="shared/Responsive.js.inc" -->


    let currentTheme = localStorage.getItem('cp_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    function applyTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = t === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
    }
    applyTheme(currentTheme);
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('cp_theme', currentTheme);
      applyTheme(currentTheme);
    }

    async function fetchStatus() {
      try {
        const r = await fetch('/api/status');
        if (r.ok) {
          const d = await r.json();
          if (document.getElementById('sbDevice')) document.getElementById('sbDevice').textContent = d.device || 'Sticky';
          if (document.getElementById('sbVersion')) document.getElementById('sbVersion').textContent = 'v' + (d.version || '1.4.11');
          if (document.getElementById('sbIp')) document.getElementById('sbIp').textContent = d.ip || window.location.hostname;
        }
      } catch (e) {}
    }
    fetchStatus();


  let allSettings = [];
  let originalValues = {};
  let preserveQuickResumeTimeoutOn = false;
  let quickResumeTimeoutAutoEnabled = false;
  const SLEEP_SCREEN_MODE = {
    QUICK_RESUME: 6
  };

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showMessage(text, isError) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + (isError ? 'error' : 'success');
    msg.style.display = 'block';
    setTimeout(function() { msg.style.display = 'none'; }, 4000);
  }

  function renderControl(setting) {
    const id = 'setting-' + setting.key;

    if (setting.type === 'toggle') {
      const checked = setting.value ? 'checked' : '';
      return '<label class="toggle-switch">' +
        '<input type="checkbox" id="' + id + '" ' + checked + ' onchange="handleSettingChanged(\'' + setting.key + '\')">' +
        '<span class="toggle-slider"></span></label>';
    }

    if (setting.type === 'enum') {
      let html = '<select id="' + id + '" onchange="handleSettingChanged(\'' + setting.key + '\')">';
      setting.options.forEach(function(opt, idx) {
        const selected = idx === setting.value ? ' selected' : '';
        html += '<option value="' + idx + '"' + selected + '>' + escapeHtml(opt) + '</option>';
      });
      html += '</select>';
      return html;
    }

    if (setting.type === 'value') {
      return '<input type="number" id="' + id + '" value="' + setting.value + '"' +
        ' min="' + setting.min + '" max="' + setting.max + '" step="' + setting.step + '"' +
        ' onchange="handleSettingChanged(\'' + setting.key + '\')">';
    }

    if (setting.type === 'string') {
      const isPassword = 'hasPassword' in setting;
      const inputType = isPassword ? 'password' : 'text';
      const val = setting.value || '';
      return '<input type="' + inputType + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
        ' placeholder="' + (setting.hasPassword ? '(unchanged)' : '') + '"' +
        ' oninput="this.dataset.changed=\'true\';handleSettingChanged(\'' + setting.key + '\')">' +
        (setting.hasPassword ? ' <button class="btn-small btn-delete" type="button" onclick="clearPassword(\'' + setting.key + '\')">Clear</button>' : '');
    }

    return '';
  }

  function getValue(setting) {
    const el = document.getElementById('setting-' + setting.key);
    if (!el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'string') {
      if ('hasPassword' in setting && !el.dataset.changed) return undefined;
      return el.value;
    }
    return undefined;
  }

  function markChanged() {
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('topSaveBtn').disabled = false;
    document.getElementById('save-container').style.display = '';
  }

  function clearPassword(key) {
    const el = getControl(key);
    el.value = '';
    el.dataset.changed = 'true';
    handleSettingChanged(key);
  }

  function findSetting(key) {
    return allSettings.find(function(s) { return s.key === key; });
  }

  function getControl(key) {
    return document.getElementById('setting-' + key);
  }

  function getControlValue(key) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum' || setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    return el.value;
  }

  function setControlValue(key, value) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return false;

    if (setting.type === 'toggle') {
      const checked = !!value;
      if (el.checked === checked) return false;
      el.checked = checked;
      return true;
    }

    const nextValue = String(value);
    if (el.value === nextValue) return false;
    el.value = nextValue;
    return true;
  }

  function isQuickResumeSleepScreenSelected() {
    const sleepScreen = findSetting('sleepScreen');
    const sleepScreenValue = getControlValue('sleepScreen');
    if (!sleepScreen || sleepScreenValue === undefined || !Number.isFinite(sleepScreenValue)) return false;

    let selectedValue = sleepScreenValue;
    if (Array.isArray(sleepScreen.values)) {
      selectedValue = Number(sleepScreen.values[sleepScreenValue]);
    } else if (Array.isArray(sleepScreen.options)) {
      const selectedOption = sleepScreen.options[sleepScreenValue];
      if (selectedOption && typeof selectedOption === 'object' && 'value' in selectedOption) {
        selectedValue = Number(selectedOption.value);
      }
    }

    return selectedValue === SLEEP_SCREEN_MODE.QUICK_RESUME;
  }

  function syncQuickResumeTimeoutForSleepScreen(sleepScreenChanged, quickResumeTimeoutChanged) {
    const timeoutValue = getControlValue('quickResumeSleepScreen');
    if (timeoutValue === undefined) return false;

    let changed = false;
    if (quickResumeTimeoutChanged) {
      preserveQuickResumeTimeoutOn = timeoutValue === 1;
      quickResumeTimeoutAutoEnabled = false;
    }

    if (isQuickResumeSleepScreenSelected()) {
      if (timeoutValue !== 1) {
        changed = setControlValue('quickResumeSleepScreen', 1);
        quickResumeTimeoutAutoEnabled = !preserveQuickResumeTimeoutOn;
      } else if (sleepScreenChanged && !preserveQuickResumeTimeoutOn) {
        quickResumeTimeoutAutoEnabled = true;
      }
      return changed;
    }

    if (sleepScreenChanged && quickResumeTimeoutAutoEnabled && !preserveQuickResumeTimeoutOn) {
      changed = setControlValue('quickResumeSleepScreen', 0);
      quickResumeTimeoutAutoEnabled = false;
    }
    return changed;
  }

  function setRowVisible(key, visible) {
    const row = document.getElementById('row-setting-' + key);
    if (row) {
      row.style.display = visible ? '' : 'none';
    }
  }

  function updateSettingsVisibility() {
    const shortPwrBtnVal = getControlValue('shortPwrBtn');
    setRowVisible('pwrBtnFootnoteBack', shortPwrBtnVal === 4);

    const sleepScreenVal = getControlValue('sleepScreen');
    const isHighlights = sleepScreenVal === 10;
    setRowVisible('sleepHighlightMinutes', isHighlights);
    setRowVisible('sleepHighlightFontFamily', isHighlights);
    setRowVisible('sleepHighlightAlign', isHighlights);

    const isCover = sleepScreenVal === 3 || sleepScreenVal === 4;
    setRowVisible('sleepScreenCoverMode', isCover);
    setRowVisible('sleepScreenCoverFilter', isCover);

    const vibrationVal = getControlValue('vibration');
    setRowVisible('hapticIntensity', vibrationVal !== undefined && vibrationVal !== 2);

    const keySoundVal = getControlValue('keySound');
    setRowVisible('buzzerVolume', !!keySoundVal);

    const touchReaderVal = getControlValue('touchReaderControls');
    setRowVisible('pageTurnGesture', !!touchReaderVal);
    setRowVisible('previousPageGesture', !!touchReaderVal);

    const progressBarVal = getControlValue('statusBarProgressBar');
    setRowVisible('statusBarProgressBarThickness', progressBarVal !== undefined && progressBarVal !== 2);
  }

  function switchTab(tabId) {
    if (history.replaceState) {
      history.replaceState(null, '', '#' + tabId);
    } else {
      location.hash = '#' + tabId;
    }
    document.querySelectorAll('.tab-trigger').forEach(function(btn) {
      const active = btn.getAttribute('data-tab') === tabId;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.querySelectorAll('.tab-pane').forEach(function(pane) {
      const active = pane.id === 'tab-pane-' + tabId;
      pane.classList.toggle('active', active);
    });
  }

  function initTabFromHash() {
    const hash = (location.hash || '').replace('#', '').trim();
    const validTabs = ['reader', 'display', 'controls', 'system', 'wifi', 'services'];
    if (hash && validTabs.includes(hash)) {
      switchTab(hash);
    }
  }
  window.addEventListener('hashchange', initTabFromHash);

  function updateTabUnsavedIndicators() {
    const tabHasChanges = {};
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) {
        const row = document.getElementById('row-setting-' + s.key);
        const pane = row ? row.closest('.tab-pane') : null;
        if (pane) {
          const tabId = pane.id.replace('tab-pane-', '');
          tabHasChanges[tabId] = true;
        }
      }
    });
    document.querySelectorAll('.tab-trigger').forEach(function(btn) {
      const tabId = btn.getAttribute('data-tab');
      let dot = btn.querySelector('.tab-unsaved-dot');
      if (tabHasChanges[tabId]) {
        if (!dot) {
          dot = document.createElement('span');
          dot.className = 'tab-unsaved-dot';
          btn.appendChild(dot);
        }
      } else if (dot) {
        dot.remove();
      }
    });
  }

  function handleSettingChanged(key) {
    syncQuickResumeTimeoutForSleepScreen(key === 'sleepScreen', key === 'quickResumeSleepScreen');
    updateSettingsVisibility();
    markChanged();
    updateTabUnsavedIndicators();
  }

  async function loadSettings() {
    try {
      const response = await fetch('/api/settings');
      if (!response.ok) {
        throw new Error('Failed to load settings: ' + response.status);
      }
      allSettings = await response.json();

      // Store original values
      originalValues = {};
      allSettings.forEach(function(s) {
        originalValues[s.key] = s.value;
      });

      // Group by category
      const groups = {};
      allSettings.forEach(function(s) {
        if (!groups[s.category]) groups[s.category] = [];
        groups[s.category].push(s);
      });

      const tabContainers = {
        reader: document.getElementById('settings-reader'),
        display: document.getElementById('settings-display'),
        controls: document.getElementById('settings-controls'),
        system: document.getElementById('settings-system'),
        fallback: document.getElementById('settings-fallback')
      };
      for (const k in tabContainers) {
        if (tabContainers[k]) tabContainers[k].innerHTML = '';
      }

      function getCategoryTab(cat) {
        const c = (cat || '').toLowerCase();
        if (c.includes('đọc') || c.includes('read') || c.includes('sách') || c.includes('book')) return 'reader';
        if (c.includes('hiển thị') || c.includes('display') || c.includes('màn hình') || c.includes('screen') || c.includes('giao diện') || c.includes('interface')) return 'display';
        if (c.includes('điều khiển') || c.includes('control') || c.includes('phím') || c.includes('button') || c.includes('thao tác') || c.includes('gesture')) return 'controls';
        if (c.includes('hệ thống') || c.includes('system')) return 'system';
        return 'system';
      }

      for (const category in groups) {
        let cardHtml = '<div class="card"><h2>' + escapeHtml(category) + '</h2>';
        groups[category].forEach(function(s) {
          cardHtml += '<div class="setting-row" id="row-setting-' + s.key + '">' +
            '<span class="setting-name">' + escapeHtml(s.name) + '</span>' +
            '<span class="setting-control">' + renderControl(s) + '</span>' +
            '</div>';
        });
        cardHtml += '</div>';

        const tabKey = getCategoryTab(category);
        const targetContainer = tabContainers[tabKey] || tabContainers.system || tabContainers.fallback;
        if (targetContainer) {
          targetContainer.insertAdjacentHTML('beforeend', cardHtml);
        }
      }

      updateSettingsVisibility();
      initTabFromHash();
      document.getElementById('save-container').style.display = 'none';
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('topSaveBtn').disabled = true;
      preserveQuickResumeTimeoutOn = getControlValue('quickResumeSleepScreen') === 1;
      quickResumeTimeoutAutoEnabled = false;
      if (syncQuickResumeTimeoutForSleepScreen(true, false)) {
        markChanged();
      }
    } catch (e) {
      console.error(e);
      const readerEl = document.getElementById('settings-reader');
      if (readerEl) {
        readerEl.innerHTML = '<div class="card"><p style="text-align:center;color:#e74c3c;">Failed to load settings</p></div>';
      }
    }
  }

  async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    document.getElementById('topSaveBtn').disabled = true;
    btn.textContent = 'Đang lưu...';

    // Collect only changed values
    const changes = {};
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) {
        changes[s.key] = current;
      }
    });

    if (Object.keys(changes).length === 0) {
      showMessage('Không có thay đổi cần lưu.', false);
      document.getElementById('save-container').style.display = 'none';
      btn.textContent = 'Lưu thay đổi';
      return;
    }

    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Save failed');
      }

      // Update original values to new values
      for (const key in changes) {
        originalValues[key] = changes[key];
      }

      showMessage('Đã lưu cài đặt!', false);
      document.getElementById('save-container').style.display = 'none';
      updateTabUnsavedIndicators();
    } catch (e) {
      console.error(e);
      showMessage('Lỗi: ' + e.message, true);
      markChanged();
      updateTabUnsavedIndicators();
    }

    btn.textContent = 'Lưu thay đổi';
  }

  // --- Wi-Fi Network Management ---
  // Renders an editable list of saved Wi-Fi networks using /api/wifi endpoints.
  // Password fields are never pre-filled; when left blank during edit, existing
  // passwords remain unchanged server-side.
  let wifiNetworks = [];

  function renderWifiNetwork(net, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    const lastConnected = net.isLastConnected
      ? '<div style="margin-top:8px;color:var(--label-color);font-size:0.9em;">Last connected network</div>'
      : '';

    return '<div class="opds-server" id="wifi-' + id + '">' +
      '<div class="setting-row">' +
        '<span class="setting-name">SSID</span>' +
        '<span class="setting-control"><input type="text" id="wifi-ssid-' + id + '" value="' + escapeHtml(net.ssid || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Password</span>' +
        '<span class="setting-control"><input type="password" id="wifi-pass-' + id + '" placeholder="' + (net.hasPassword ? '(unchanged)' : '') + '"></span>' +
      '</div>' +
      lastConnected +
      '<div class="opds-actions">' +
        '<button class="btn-small btn-save-server" onclick="saveWifiNetwork(' + idx + ')">Save</button>' +
        (isNew ? '' : '<button class="btn-small btn-delete" onclick="deleteWifiNetwork(' + idx + ')">Delete</button>') +
      '</div>' +
    '</div>';
  }

  function renderWifiSection() {
    const container = document.getElementById('wifi-container');
    let html = '<div class="card"><h2>Wi-Fi Networks</h2>';

    if (wifiNetworks.length === 0) {
      html += '<p style="color:var(--label-color);text-align:center;">No Wi-Fi networks saved</p>';
    } else {
      wifiNetworks.forEach(function(net, idx) {
        html += renderWifiNetwork(net, idx);
      });
    }

    html += '<div style="margin-top:12px;text-align:center;">' +
      '<button class="btn-small btn-add" onclick="addWifiNetwork()">+ Add Network</button>' +
    '</div></div>';
    container.innerHTML = html;
  }

  async function loadWifiNetworks() {
    try {
      const resp = await fetch('/api/wifi');
      if (!resp.ok) throw new Error('Failed to load');
      wifiNetworks = await resp.json();
      renderWifiSection();
    } catch (e) {
      console.error('Wi-Fi load error:', e);
    }
  }

  function addWifiNetwork() {
    const container = document.getElementById('wifi-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-network forms at once (idx -1 -> id "new")
    if (document.getElementById('wifi-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderWifiNetwork({ssid:'',hasPassword:false,isLastConnected:false}, -1));
  }

  async function saveWifiNetwork(idx) {
    const id = idx === -1 ? 'new' : idx;
    const ssid = document.getElementById('wifi-ssid-' + id).value.trim();
    if (!ssid) {
      showMessage('SSID is required.', true);
      return;
    }

    const data = { ssid: ssid };
    // Only include password when the user actually typed something; omitting it
    // tells the server to preserve an existing password.
    const pass = document.getElementById('wifi-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/wifi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Wi-Fi network saved!', false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage('Error: ' + e.message, true);
    }
  }

  async function deleteWifiNetwork(idx) {
    if (!confirm('Delete this Wi-Fi network?')) return;
    try {
      const resp = await fetch('/api/wifi/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Wi-Fi network deleted', false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage('Error: ' + e.message, true);
    }
  }

  // --- OPDS Server Management ---
  // Dynamically renders an editable list of OPDS servers, communicating with the
  // /api/opds REST endpoints. Password fields are never pre-filled for security;
  // the "(unchanged)" placeholder indicates an existing password is preserved on save.
  let opdsServers = [];

  function renderOpdsServer(srv, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    return '<div class="opds-server" id="opds-' + id + '">' +
      '<div class="setting-row">' +
        '<span class="setting-name">Server Name</span>' +
        '<span class="setting-control"><input type="text" id="opds-name-' + id + '" value="' + escapeHtml(srv.name || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">URL</span>' +
        '<span class="setting-control"><input type="text" id="opds-url-' + id + '" value="' + escapeHtml(srv.url || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Username</span>' +
        '<span class="setting-control"><input type="text" id="opds-user-' + id + '" value="' + escapeHtml(srv.username || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Password</span>' +
        '<span class="setting-control"><input type="password" id="opds-pass-' + id + '" placeholder="' + (srv.hasPassword ? '(unchanged)' : '') + '"></span>' +
      '</div>' +
      '<div class="opds-actions">' +
        '<button class="btn-small btn-save-server" onclick="saveOpdsServer(' + idx + ')">Save</button>' +
        (isNew ? '' : '<button class="btn-small btn-delete" onclick="deleteOpdsServer(' + idx + ')">Delete</button>') +
      '</div>' +
    '</div>';
  }

  function renderOpdsSection() {
    const container = document.getElementById('opds-container');
    let html = '<div class="card"><h2>OPDS Servers</h2>';

    if (opdsServers.length === 0) {
      html += '<p style="color:var(--label-color);text-align:center;">No OPDS servers configured</p>';
    } else {
      opdsServers.forEach(function(srv, idx) {
        html += renderOpdsServer(srv, idx);
      });
    }

    html += '<div style="margin-top:12px;text-align:center;">' +
      '<button class="btn-small btn-add" onclick="addOpdsServer()">+ Add Server</button>' +
    '</div></div>';
    container.innerHTML = html;
  }

  async function loadOpdsServers() {
    try {
      const resp = await fetch('/api/opds');
      if (!resp.ok) throw new Error('Failed to load');
      opdsServers = await resp.json();
      renderOpdsSection();
    } catch (e) {
      console.error('OPDS load error:', e);
    }
  }

  function addOpdsServer() {
    const container = document.getElementById('opds-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-server forms at once (idx -1 → id "new")
    if (document.getElementById('opds-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderOpdsServer({name:'',url:'',username:'',hasPassword:false}, -1));
  }

  async function saveOpdsServer(idx) {
    const id = idx === -1 ? 'new' : idx;
    const data = {
      name: document.getElementById('opds-name-' + id).value,
      url: document.getElementById('opds-url-' + id).value,
      username: document.getElementById('opds-user-' + id).value,
    };
    // Only include password in payload when the user actually typed something;
    // omitting it tells the server to keep the existing password.
    const pass = document.getElementById('opds-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/opds', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('OPDS server saved!', false);
      await loadOpdsServers();
    } catch (e) {
      showMessage('Error: ' + e.message, true);
    }
  }

  async function deleteOpdsServer(idx) {
    if (!confirm('Delete this OPDS server?')) return;
    try {
      const resp = await fetch('/api/opds/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('OPDS server deleted', false);
      await loadOpdsServers();
    } catch (e) {
      showMessage('Error: ' + e.message, true);
    }
  }

  // Sequential, not concurrent: the device's web server handles one client
  // connection at a time, and simultaneous fetches on page load can
  // stall long enough inside a single response to trip the firmware watchdog.
  (async () => {
    await loadSettings();
    await loadWifiNetworks();
    await loadOpdsServers();
    await loadPlugins('settings');
