name: Release CrossNext for Sticky

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO and Tools
        run: |
          python -m pip install --upgrade pip
          pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          pip install -U esptool "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "intelhex>=2.3.0"

      - name: Cache PlatformIO Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Firmware for Seeed Sticky
        run: |
          pio pkg install -e gh_release_sticky
          pio run -e gh_release_sticky

      - name: Package Firmware Assets
        id: package
        run: |
          BUILD_DIR=".pio/build/gh_release_sticky"
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(grep -E '^\s*version\s*=' platformio.ini | head -n1 | sed -E 's/.*=\s*([0-9\.]+)/v\1/')
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          # 1. Official OTA asset expected by OtaUpdater
          cp "$BUILD_DIR/firmware.bin" "$DIST_DIR/firmware-sticky.bin"

          # 2. Versioned app image
          cp "$BUILD_DIR/firmware.bin" "$DIST_DIR/CrossNext-Sticky-${TAG}-app.bin"

          # 3. Merged factory image (flash at offset 0x0)
          esptool.py --chip esp32s3 merge_bin -o "$DIST_DIR/CrossNext-Sticky-${TAG}-factory.bin" \
            --flash_mode keep --flash_size keep \
            0x0     "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"

          # 4. Blank OTA data
          python3 -c "open('$DIST_DIR/otadata-blank.bin', 'wb').write(b'\xff' * 0x2000)"

          # 5. Checksums
          cd "$DIST_DIR"
          sha256sum * > SHA256SUMS.txt
          cd ..

          # 6. Bundle ZIP
          zip -j "$DIST_DIR/CrossNext-Sticky-${TAG}.zip" "$DIST_DIR"/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.TAG }}
          name: CrossNext for Seeed reTerminal Sticky ${{ steps.package.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/firmware-sticky.bin
            dist/CrossNext-Sticky-*-app.bin
            dist/CrossNext-Sticky-*-factory.bin
            dist/CrossNext-Sticky-*.zip
            dist/otadata-blank.bin
            dist/SHA256SUMS.txt
